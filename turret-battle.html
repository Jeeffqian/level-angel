<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炮台对决 - Turret Battle</title>
<style>
  :root { --bg:#0e1626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #284a7a, transparent 60%),
      radial-gradient(900px 500px at 85% 110%, #6d3652, transparent 60%),
      linear-gradient(180deg, #0c1526, #090e1b);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e8eef7;
    user-select: none;
    padding: 20px;
  }
  h1 {
    font-size: 24px; letter-spacing: 4px; font-weight: 800; margin: 0;
    background: linear-gradient(90deg, #ffd166, #ff7e5f, #ffd166);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 200% 0; } }
  #wrap { position: relative; }
  canvas {
    display: block; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 12px 50px rgba(0,0,0,.65), inset 0 0 0 1px rgba(0,0,0,.3);
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .hp-box { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
  .hp-box.right { align-items: flex-end; }
  .hp-label { font-size: 13px; font-weight: 700; opacity: .95; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .bar {
    width: 150px; height: 15px; position: relative;
    background: rgba(6,10,20,.6); border: 1px solid rgba(255,255,255,.16);
    border-radius: 9px; overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(0,0,0,.6);
  }
  .bar::after {
    content: ''; position: absolute; inset: 0; border-radius: 9px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.28), transparent 45%);
  }
  .bar .fill { height: 100%; width: 100%; transition: width .25s; border-radius: 9px; }
  #phpfill { background: linear-gradient(90deg, #33c15a, #7ee89a); float: left; }
  #aihpfill { background: linear-gradient(270deg, #ff3b30, #ff8a80); float: right; }
  .hp-num { font-size: 11px; opacity: .85; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #center {
    position: absolute; top: 12px; left: 0; right: 0; text-align: center;
    pointer-events: none;
  }
  #msg { font-size: 19px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,.85); }
  #sub { font-size: 12.5px; opacity: .85; margin-top: 4px; text-shadow: 0 1px 6px rgba(0,0,0,.85); }
  #controls {
    margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    font-size: 13px; opacity: .9;
  }
  #controls b { color: #ffd166; }
  button {
    margin-top: 14px; padding: 10px 26px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 30px; cursor: pointer; letter-spacing: 1px;
    background: linear-gradient(90deg, #ffb347, #ff7e5f); color: #1b1b1b;
    box-shadow: 0 6px 22px rgba(255,126,95,.5), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 10px 28px rgba(255,126,95,.6); }
  button:active { transform: translateY(0) scale(.98); }
  .wind { display: inline-flex; align-items: center; gap: 6px; }
  #topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  #topbar h1 { margin-bottom: 0; }
  #wallet {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
    background: rgba(255,255,255,.08); padding: 6px 14px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.12);
  }
  #wallet b { color: #ffd166; font-size: 16px; }
  #actions { display: flex; gap: 12px; margin-top: 14px; }
  #actions button { margin-top: 0; }
  #shopBtn { background: linear-gradient(90deg, #4cd9c0, #4c8dff); box-shadow: 0 6px 20px rgba(76,141,255,.35); }
  #shop {
    position: fixed; inset: 0; background: rgba(6,10,20,.84);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #shopPanel {
    width: min(840px, 92vw); max-height: 88vh; overflow: auto;
    background: linear-gradient(180deg, #18233c, #101828);
    border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
    padding: 22px 24px; box-shadow: 0 24px 80px rgba(0,0,0,.7);
  }
  #shopHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #shopHead h2 { font-size: 20px; letter-spacing: 1px; }
  #shopHead span { font-size: 14px; opacity: .8; }
  #shopCoins { color: #ffd166; font-weight: 700; }
  #shopGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
  .tank-card {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .tank-card.selected { border-color: #4cd964; box-shadow: 0 0 0 1px #4cd964, 0 8px 24px rgba(76,217,100,.2); }
  .tank-top { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .tank-top .price { margin-left: auto; font-size: 13px; color: #ffd166; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .srow { display: flex; align-items: center; gap: 8px; font-size: 12px; opacity: .9; }
  .srow > span { width: 30px; }
  .sbar { flex: 1; height: 7px; background: rgba(0,0,0,.4); border-radius: 6px; overflow: hidden; }
  .sbar i { display: block; height: 100%; background: linear-gradient(90deg, #4c8dff, #4cd9c0); border-radius: 6px; }
  .tdesc { font-size: 12px; opacity: .65; min-height: 32px; line-height: 1.4; }
  .tank-card button { margin-top: 2px; padding: 8px; font-size: 14px; border-radius: 10px; }
  .tank-card button.owned { background: linear-gradient(90deg, #4cd9c0, #4c8dff); box-shadow: 0 6px 20px rgba(76,141,255,.35); }
  .tank-card button:disabled { background: rgba(255,255,255,.12); color: #9aa6b8; cursor: not-allowed; box-shadow: none; }
  .tank-card button:disabled:hover { transform: none; }
  #closeShop { background: rgba(255,255,255,.1); color: #e8eef7; padding: 8px 18px; font-size: 14px; }
</style>
</head>
<body>
  <div id="topbar">
    <h1>炮台对决</h1>
    <div id="wallet">材料 <b id="coins">0</b> ⚙</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="hud">
      <div class="hp-box">
        <div class="hp-label" id="plabel">你</div>
        <div class="bar"><div class="fill" id="phpfill"></div></div>
        <div class="hp-num" id="pnum">100</div>
      </div>
      <div class="hp-box right">
        <div class="hp-label">AI 炮台</div>
        <div class="bar"><div class="fill" id="aihpfill"></div></div>
        <div class="hp-num" id="ainum">100</div>
      </div>
    </div>
    <div id="center">
      <div id="msg"></div>
      <div id="sub"></div>
    </div>
  </div>
  <div id="controls">
    <span><b>← →</b> 调整角度</span>
    <span><b>↑ ↓</b> 调整力度</span>
    <span><b>空格</b> 开火</span>
    <span class="wind" id="wind"></span>
  </div>
  <div id="actions">
    <button id="restart">重新开始</button>
    <button id="shopBtn">坦克库</button>
  </div>

  <div id="shop">
    <div id="shopPanel">
      <div id="shopHead">
        <h2>坦克库</h2>
        <div>
          <span>材料 <b id="shopCoins">0</b> ⚙ &nbsp;·&nbsp; 胜 <b id="shopWins">0</b> 负 <b id="shopLosses">0</b></span>
          <button id="closeShop">关闭</button>
        </div>
      </div>
      <div id="shopGrid"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GRAVITY = 520;
const MIN_POWER = 260, MAX_POWER = 700;
const EXPLODE_R = 42;
const TURRET_R = 16;

let terrain = [];
let player, ai, projectile, particles = [];
let wind = 0;
let angle = 55, power = 430;
let state = 'aim';       // 'aim' | 'flight' | 'ai' | 'gameover'
let turn = 'player';
let aiTimer = 0;
let winner = null;
let shake = 0;

const TANKS = [
  { id: 'rookie',  name: '新兵',   price: 0,   color: '#4cd964', atk: 1.00, def: 1.00, hp: 100, desc: '标准战车，攻守均衡，开局即拥有。' },
  { id: 'gale',    name: '疾风',   price: 120, color: '#7cc4ff', atk: 1.15, def: 1.10, hp: 100, desc: '轻量化底盘，火力与机动小幅提升。' },
  { id: 'fort',    name: '铁壁',   price: 180, color: '#4cd9c0', atk: 0.95, def: 1.55, hp: 130, desc: '重装甲堡垒，受到伤害大幅降低。' },
  { id: 'heavy',   name: '重炮',   price: 200, color: '#ffa24c', atk: 1.45, def: 0.90, hp: 100, desc: '巨炮口径，输出爆表但装甲薄弱。' },
  { id: 'phantom', name: '幽灵',   price: 300, color: '#c58bff', atk: 1.30, def: 1.35, hp: 115, desc: '隐形涂层，攻守兼备的高端战车。' },
  { id: 'titan',   name: '泰坦',   price: 520, color: '#ff5f56', atk: 1.60, def: 1.60, hp: 150, desc: '终极兵器，全面强化，碾压战场。' }
];

let save = loadSave();
let playerTank = tankById(save.selected);
let aiAtk = 1, aiDef = 1;

function loadSave() {
  const s = { coins: 0, owned: ['rookie'], selected: 'rookie', wins: 0, losses: 0 };
  try {
    const raw = localStorage.getItem('turretBattleSave');
    if (raw) Object.assign(s, JSON.parse(raw));
  } catch (e) {}
  if (!Array.isArray(s.owned) || !s.owned.includes('rookie')) s.owned = ['rookie', ...(s.owned || [])];
  if (!s.owned.includes(s.selected)) s.selected = 'rookie';
  return s;
}
function persist() {
  try { localStorage.setItem('turretBattleSave', JSON.stringify(save)); } catch (e) {}
}
function tankById(id) { return TANKS.find(t => t.id === id) || TANKS[0]; }

let clouds = [], mountains = [], shockwaves = [];
let decor = { pebbles: [], grass: [] };
let sun = { x: 0, y: 0 };
let time = 0;

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shade(hex, amt) {
  const h = hex.replace('#', '');
  let r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function genBackdrop() {
  sun = { x: W * 0.79, y: H * 0.24 };
  clouds = [];
  for (let i = 0; i < 9; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 20 + Math.random() * 210,
      s: 0.55 + Math.random() * 1.35,
      v: 3 + Math.random() * 9,
      a: 0.10 + Math.random() * 0.20,
      warm: Math.random()
    });
  }
  mountains = [
    { base: H * 0.68, amp: H * 0.16, freq: 0.0034, phase: Math.random() * 6.28, color: '#3c5c7e', alpha: 0.85 },
    { base: H * 0.78, amp: H * 0.12, freq: 0.0058, phase: Math.random() * 6.28, color: '#2b4763', alpha: 0.95 }
  ];
}

function genDecor() {
  decor.pebbles = [];
  for (let i = 0; i < 320; i++) {
    decor.pebbles.push({ x: Math.random() * W, dy: 14 + Math.random() * 300, r: 0.8 + Math.random() * 2.6, t: Math.random() });
  }
  decor.grass = [];
  for (let i = 0; i < 560; i++) {
    decor.grass.push({ x: Math.random() * W, h: 3 + Math.random() * 8, lean: (Math.random() - 0.5) * 5, t: Math.random() });
  }
}

function terrainY(x) {
  const i = Math.max(0, Math.min(W - 1, Math.round(x)));
  return terrain[i];
}

function genTerrain() {
  terrain = new Array(W);
  const base = H * 0.48;
  const a1 = H * 0.12, f1 = Math.random() * 0.005 + 0.003, p1 = Math.random() * 6.28;
  const a2 = H * 0.07, f2 = Math.random() * 0.010 + 0.006, p2 = Math.random() * 6.28;
  const a3 = H * 0.04, f3 = Math.random() * 0.018 + 0.014, p3 = Math.random() * 6.28;
  for (let i = 0; i < W; i++) {
    let v = base
      + a1 * Math.sin(i * f1 + p1)
      + a2 * Math.sin(i * f2 + p2)
      + a3 * Math.sin(i * f3 + p3);
    terrain[i] = Math.max(H * 0.2, Math.min(H * 0.88, v));
  }
}

function makeTurret(x, tank) {
  const hp = tank ? tank.hp : 100;
  return { x, y: terrainY(x), hp, maxHp: hp, color: tank ? tank.color : '#4cd964', name: tank ? tank.name : '' };
}

function newRound() {
  wind = (Math.random() * 2 - 1) * 28;
  setMsg(turn === 'player' ? '你的回合！' : 'AI 回合...', '');
}

function setMsg(m, s) {
  document.getElementById('msg').textContent = m;
  document.getElementById('sub').textContent = s || '';
}

function start() {
  genTerrain();
  genBackdrop();
  genDecor();
  playerTank = tankById(save.selected);
  const diff = Math.min(save.wins, 15);
  aiAtk = 1 + diff * 0.02;
  aiDef = 1 + diff * 0.015;
  player = makeTurret(160, playerTank);
  ai = makeTurret(W - 160, { hp: 100 + diff * 3, color: '#ff5f56', name: 'AI' });
  projectile = null;
  particles = [];
  angle = 55; power = 430;
  state = 'aim'; turn = 'player'; winner = null;
  newRound();
  updateWallet();
  updateHUD();
}

function fire(turret, aDeg, pw) {
  const a = aDeg * Math.PI / 180;
  const mx = turret.x + Math.cos(a) * 42;
  const my = turret.y - 31 - Math.sin(a) * 42;
  projectile = {
    x: mx, y: my,
    vx: Math.cos(a) * pw,
    vy: -Math.sin(a) * pw,
    owner: turret === player ? 'player' : 'ai',
    trail: []
  };
  state = 'flight';
  setMsg(turret === player ? '炮弹飞行中...' : 'AI 的炮弹飞来！', '');
}

function simulate(sx, sy, aDeg, pw) {
  const a = aDeg * Math.PI / 180;
  let x = sx + Math.cos(a) * 42, y = sy - 31 - Math.sin(a) * 42;
  let vx = Math.cos(a) * pw, vy = -Math.sin(a) * pw;
  const dt = 1 / 60;
  for (let s = 0; s < 800; s++) {
    vx += wind * dt;
    vy += GRAVITY * dt;
    x += vx * dt; y += vy * dt;
    if (x < 0 || x >= W || y > H) return { x, y };
    if (y >= terrainY(x)) return { x, y };
  }
  return { x, y };
}

function aiAim() {
  let best = null;
  for (let a = 92; a <= 178; a += 1) {
    for (let pw = MIN_POWER; pw <= MAX_POWER; pw += 12) {
      const r = simulate(ai.x, ai.y, a, pw);
      const d = Math.abs(r.x - player.x);
      if (!best || d < best.d) best = { a, pw, d };
    }
  }
  best.a += (Math.random() * 2 - 1) * 5;
  best.pw += (Math.random() * 2 - 1) * 45;
  best.a = Math.max(90, Math.min(180, best.a));
  best.pw = Math.max(MIN_POWER, Math.min(MAX_POWER, best.pw));
  return best;
}

function explode() {
  const p = projectile;
  const owner = p.owner;
  const ex = p.x, ey = p.y;
  for (let i = Math.max(0, Math.round(ex - EXPLODE_R)); i <= Math.min(W - 1, Math.round(ex + EXPLODE_R)); i++) {
    const dx = i - ex;
    const dy = Math.sqrt(Math.max(0, EXPLODE_R * EXPLODE_R - dx * dx));
    const bottom = ey + dy;
    if (bottom > terrain[i]) terrain[i] = Math.min(bottom, H);
  }
  damageTurret(player, ex, ey, owner);
  damageTurret(ai, ex, ey, owner);
  spawnExplosion(ex, ey);
  shake = 10;
  projectile = null;
  settleTurret(player); settleTurret(ai);
  afterExplosion();
}

function damageTurret(t, ex, ey, owner) {
  const d = Math.hypot(t.x - ex, (t.y - 20) - ey);
  if (d >= EXPLODE_R + TURRET_R) return;
  let dmg = 65 * (1 - d / (EXPLODE_R + TURRET_R));
  if (t === ai) dmg *= (owner === 'player' ? playerTank.atk : 1);
  if (t === player && owner === 'ai') dmg *= aiAtk;
  if (t === player) dmg /= playerTank.def; else dmg /= aiDef;
  t.hp = Math.max(0, t.hp - Math.round(dmg));
}

function settleTurret(t) { t.y = terrainY(t.x); }

function afterExplosion() {
  updateHUD();
  if (player.hp <= 0 || ai.hp <= 0) {
    state = 'gameover';
    winner = player.hp > 0 ? 'player' : 'ai';
    if (winner === 'player') {
      const reward = 45 + Math.round(Math.random() * 25) + Math.round(player.hp * 0.6);
      save.coins += reward;
      save.wins++;
      persist();
      setMsg('你赢了！', `获得材料 +${reward} ⚙  ·  打开坦克库升级你的战车`);
    } else {
      const scrap = 8;
      save.coins += scrap;
      save.losses++;
      persist();
      setMsg('你输了...', `残骸回收 +${scrap} ⚙  ·  换个坦克再战`);
    }
    updateWallet();
    return;
  }
  if (turn === 'player') {
    turn = 'ai';
    state = 'ai';
    aiTimer = 0.7;
    setMsg('AI 正在瞄准...', '');
  } else {
    turn = 'player';
    state = 'aim';
    newRound();
  }
  updateHUD();
}

function spawnExplosion(ex, ey) {
  shockwaves.push({ x: ex, y: ey, r: 8, max: EXPLODE_R * 2.6, life: 0.5, t: 0.5 });
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 280;
    particles.push({
      x: ex, y: ey,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 0.45 + Math.random() * 0.5, max: 0.95,
      r: 2 + Math.random() * 3.6,
      c: Math.random() < 0.45 ? '#ffd166' : Math.random() < 0.5 ? '#ff7e3c' : '#fff2b0',
      grav: 520, kind: 'spark'
    });
  }
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = 10 + Math.random() * 55;
    particles.push({
      x: ex, y: ey,
      vx: Math.cos(a) * sp, vy: -18 - Math.random() * 42,
      life: 0.7 + Math.random() * 0.8, max: 1.5,
      r: 6 + Math.random() * 11,
      c: '95,90,80',
      grav: -26, kind: 'smoke', grow: 30, drag: 0.95
    });
  }
  for (let i = 0; i < 11; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, sp = 130 + Math.random() * 220;
    particles.push({
      x: ex, y: ey,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.6 + Math.random() * 0.6, max: 1.2,
      r: 2 + Math.random() * 2.2,
      c: '58,54,46',
      grav: 700, kind: 'debris'
    });
  }
}

function updateParticles(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const w = shockwaves[i];
    w.t -= dt;
    if (w.t <= 0) { shockwaves.splice(i, 1); continue; }
    w.r = w.max * (1 - w.t / w.life);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += (p.grav || 500) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'smoke') {
      p.r += (p.grow || 0) * dt;
      p.vx *= (p.drag || 1);
      p.vy *= (p.drag || 1);
    }
  }
}

function update(dt) {
  time += dt;
  if (shake > 0) shake -= dt * 30;

  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 160) c.x = -160;
  }

  if (state === 'flight' && projectile) {
    const p = projectile;
    p.vx += wind * dt;
    p.vy += GRAVITY * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 22) p.trail.shift();

    const hitPlayer = Math.hypot(p.x - player.x, p.y - (player.y - 20)) < TURRET_R + 3;
    const hitAi = Math.hypot(p.x - ai.x, p.y - (ai.y - 20)) < TURRET_R + 3;
    const hitGround = p.vy > 0 && p.y >= terrainY(p.x);
    const out = p.x < 0 || p.x >= W || p.y > H + 40;

    if (hitPlayer || hitAi || hitGround || out) {
      explode();
    }
  } else if (state === 'ai') {
    aiTimer -= dt;
    if (aiTimer <= 0) {
      const aim = aiAim();
      ai.aimA = aim.a; ai.aimP = aim.pw;
      fire(ai, aim.a, aim.pw);
    }
  }

  updateParticles(dt);
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1b34');
  g.addColorStop(0.32, '#22456e');
  g.addColorStop(0.6, '#5f6a94');
  g.addColorStop(0.82, '#c98a63');
  g.addColorStop(1, '#efc08a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const sg = ctx.createRadialGradient(sun.x, sun.y, 4, sun.x, sun.y, 260);
  sg.addColorStop(0, 'rgba(255,242,200,.95)');
  sg.addColorStop(0.16, 'rgba(255,214,150,.55)');
  sg.addColorStop(0.5, 'rgba(255,170,110,.16)');
  sg.addColorStop(1, 'rgba(255,170,110,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sun.x, sun.y, 260, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.arc(sun.x, sun.y, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#fff6d6'; ctx.fill();
  ctx.beginPath(); ctx.arc(sun.x, sun.y, 20, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,240,190,.9)'; ctx.fill();
}

function drawMountains() {
  for (const m of mountains) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 5) {
      const y = m.base
        - Math.abs(Math.sin(x * m.freq + m.phase)) * m.amp
        - Math.sin(x * m.freq * 2.3 + m.phase * 1.7) * m.amp * 0.28;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.globalAlpha = m.alpha;
    ctx.fillStyle = m.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawClouds() {
  for (const c of clouds) {
    const s = c.s;
    const puffs = [[0, 0, 54], [-48, 12, 40], [48, 10, 42], [-22, -16, 36], [26, -12, 34], [4, 16, 40]];
    ctx.save();
    ctx.globalAlpha = c.a;
    ctx.fillStyle = c.warm > 0.5 ? '#ffe6cf' : '#e6ecf5';
    for (const [px, py, pr] of puffs) {
      ctx.beginPath();
      ctx.arc(c.x + px * s, c.y + py * s, pr * s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawTerrain() {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < W; i++) ctx.lineTo(i, terrain[i]);
  ctx.lineTo(W, H);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, H * 0.22, 0, H);
  g.addColorStop(0, '#4d7f42');
  g.addColorStop(0.22, '#3f6b39');
  g.addColorStop(0.6, '#2f5030');
  g.addColorStop(1, '#1f3620');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  ctx.clip();

  for (const p of decor.pebbles) {
    const y = terrainY(p.x) + p.dy;
    if (y > H + 4) continue;
    ctx.globalAlpha = 0.18 + p.t * 0.28;
    ctx.fillStyle = p.t < 0.55 ? '#5c4a34' : '#7f8f60';
    ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (let y = 0; y < 4; y++) {
    ctx.beginPath();
    for (let i = 0; i < W; i += 6) {
      const d = 26 + y * 60 + Math.sin(i * 0.05 + y) * 12;
      const yy = terrainY(i) + d;
      if (i === 0) ctx.moveTo(i, yy); else ctx.lineTo(i, yy);
    }
    ctx.strokeStyle = `rgba(0,0,0,${0.05 + y * 0.02})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();

  ctx.beginPath();
  for (let i = 0; i < W; i++) { if (i === 0) ctx.moveTo(i, terrain[i]); else ctx.lineTo(i, terrain[i]); }
  ctx.lineWidth = 9; ctx.strokeStyle = '#3f6b39'; ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < W; i++) { if (i === 0) ctx.moveTo(i, terrain[i]); else ctx.lineTo(i, terrain[i]); }
  ctx.lineWidth = 3.5; ctx.strokeStyle = '#7cc35a'; ctx.stroke();

  for (const b of decor.grass) {
    const y = terrainY(b.x);
    if (y > H) continue;
    ctx.beginPath();
    ctx.moveTo(b.x, y + 1);
    ctx.quadraticCurveTo(b.x + b.lean * 0.5, y - b.h * 0.6, b.x + b.lean, y - b.h);
    ctx.strokeStyle = b.t < 0.5 ? '#8fd06a' : '#69ad4a';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }
}

function drawTurret(t, aDeg, color) {
  const cx = t.x, gy = t.y;
  const dark = shade(color, -0.5);
  const mid = color;
  const light = shade(color, 0.42);

  ctx.save();

  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.ellipse(cx, gy + 1, 37, 7, 0, 0, Math.PI * 2); ctx.fill();

  const tg = ctx.createLinearGradient(0, gy - 17, 0, gy + 1);
  tg.addColorStop(0, '#454b54');
  tg.addColorStop(1, '#1d2129');
  rr(cx - 33, gy - 17, 66, 17, 8);
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,.32)'; ctx.lineWidth = 1.4;
  for (let x = cx - 28; x <= cx + 28; x += 5.5) {
    ctx.beginPath(); ctx.moveTo(x, gy - 16); ctx.lineTo(x, gy - 1); ctx.stroke();
  }
  for (let x = cx - 22; x <= cx + 22; x += 11) {
    ctx.beginPath(); ctx.arc(x, gy - 8.5, 3.8, 0, Math.PI * 2);
    ctx.fillStyle = '#59616d'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, gy - 8.5, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = '#161a20'; ctx.fill();
  }

  ctx.save();
  ctx.translate(cx + 2, gy - 31);
  ctx.rotate(-aDeg * Math.PI / 180);
  const bg = ctx.createLinearGradient(0, -5, 0, 5);
  bg.addColorStop(0, light); bg.addColorStop(0.5, mid); bg.addColorStop(1, dark);
  rr(0, -4.5, 40, 9, 4);
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1; ctx.stroke();
  rr(33, -6.5, 10, 13, 3);
  ctx.fillStyle = '#2b3038'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -2.6); ctx.lineTo(32, -2.6);
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.restore();

  const hg = ctx.createLinearGradient(0, gy - 34, 0, gy - 13);
  hg.addColorStop(0, light); hg.addColorStop(0.42, mid); hg.addColorStop(1, dark);
  ctx.beginPath();
  ctx.moveTo(cx - 29, gy - 14);
  ctx.lineTo(cx - 25, gy - 30);
  ctx.lineTo(cx + 24, gy - 30);
  ctx.lineTo(cx + 31, gy - 20);
  ctx.lineTo(cx + 28, gy - 14);
  ctx.closePath();
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 24, gy - 27); ctx.lineTo(cx + 23, gy - 27);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.3; ctx.stroke();

  const dg = ctx.createRadialGradient(cx - 5, gy - 41, 2, cx, gy - 35, 19);
  dg.addColorStop(0, light); dg.addColorStop(0.55, mid); dg.addColorStop(1, dark);
  rr(cx - 15, gy - 45, 30, 16, 8);
  ctx.fillStyle = dg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, gy - 38, 13, Math.PI * 1.05, Math.PI * 1.95);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.7; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 8, gy - 40, 2.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();

  ctx.restore();
}

function drawProjectile() {
  const p = projectile;
  for (let i = 0; i < p.trail.length; i++) {
    const t = p.trail[i];
    const k = i / p.trail.length;
    ctx.beginPath();
    ctx.arc(t.x, t.y, k * 4 + 1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,170,80,${k * 0.45})`;
    ctx.fill();
  }
  const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
  gg.addColorStop(0, 'rgba(255,245,190,.95)');
  gg.addColorStop(0.4, 'rgba(255,200,90,.5)');
  gg.addColorStop(1, 'rgba(255,160,60,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#fff6cc'; ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2);
  ctx.fillStyle = '#ff9d3c'; ctx.fill();
}

function drawParticles() {
  for (const w of shockwaves) {
    const a = Math.max(0, w.t / w.life);
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,220,150,${a * 0.55})`;
    ctx.lineWidth = a * 3.5 + 1;
    ctx.stroke();
  }
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    if (p.kind === 'smoke') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.c},${a * 0.35})`; ctx.fill();
    } else {
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.c; ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function predictPath(aDeg, pw) {
  const a = aDeg * Math.PI / 180;
  let x = player.x + Math.cos(a) * 42;
  let y = player.y - 31 - Math.sin(a) * 42;
  let vx = Math.cos(a) * pw, vy = -Math.sin(a) * pw;
  const dt = 1 / 60;
  const pts = [];
  for (let s = 0; s < 800; s++) {
    vx += wind * dt;
    vy += GRAVITY * dt;
    x += vx * dt; y += vy * dt;
    if (s % 2 === 0) pts.push({ x, y });
    if (x < 0 || x >= W || y > H) break;
    if (vy > 0 && y >= terrainY(x)) break;
  }
  return pts;
}

function drawAim() {
  if (state !== 'aim' || turn !== 'player') return;
  const pts = predictPath(angle, power);
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const t = i / pts.length;
    const tw = (time * 2 + i) % 4 < 2;
    if (!tw) continue;
    ctx.globalAlpha = 0.95 * (1 - t * 0.65);
    const r = Math.max(1.4, 3.2 * (1 - t * 0.5));
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,220,120,.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe08a'; ctx.fill();
  }
  ctx.globalAlpha = 1;
  const end = pts[pts.length - 1];
  if (!end) return;
  const pulse = 1 + Math.sin(time * 6) * 0.15;
  ctx.beginPath(); ctx.arc(end.x, end.y, 9 * pulse, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,224,138,.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(end.x, end.y, 15 * pulse, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,224,138,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(end.x, end.y, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe08a'; ctx.fill();
}

function drawWind() {
  const el = document.getElementById('wind');
  const dir = wind === 0 ? '无风' : wind > 0 ? '→ 顺风' : '← 逆风';
  const arrow = wind > 0.5 ? '→' : wind < -0.5 ? '←' : '·';
  el.innerHTML = `<b>风</b> ${arrow} ${Math.abs(wind).toFixed(0)}`;
}

function updateHUD() {
  document.getElementById('phpfill').style.width = (player.hp / player.maxHp * 100) + '%';
  document.getElementById('aihpfill').style.width = (ai.hp / ai.maxHp * 100) + '%';
  document.getElementById('plabel').textContent = player.name;
  document.getElementById('pnum').textContent = player.hp + ' / ' + player.maxHp;
  document.getElementById('ainum').textContent = ai.hp + ' / ' + ai.maxHp;
  const ang = turn === 'player' && (state === 'aim' || state === 'flight') ? angle : (ai.aimA || 120);
  const pw = turn === 'player' ? power : (ai.aimP || 400);
  document.getElementById('sub').textContent =
    `角度 ${Math.round(ang)}°  ·  力度 ${Math.round(pw)}`;
  drawWind();
}

function updateWallet() {
  document.getElementById('coins').textContent = save.coins;
}

function statBar(label, val, max) {
  return `<div class="srow"><span>${label}</span><div class="sbar"><i style="width:${Math.min(100, Math.max(4, val / max * 100))}%"></i></div></div>`;
}

function renderShop() {
  document.getElementById('shopCoins').textContent = save.coins;
  document.getElementById('shopWins').textContent = save.wins;
  document.getElementById('shopLosses').textContent = save.losses;
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  for (const t of TANKS) {
    const owned = save.owned.includes(t.id);
    const selected = save.selected === t.id;
    const card = document.createElement('div');
    card.className = 'tank-card' + (selected ? ' selected' : '');
    let btn;
    if (selected) {
      btn = `<button disabled>使用中</button>`;
    } else if (owned) {
      btn = `<button class="owned" data-use="${t.id}">使用</button>`;
    } else if (save.coins >= t.price) {
      btn = `<button data-buy="${t.id}">购买 · ${t.price} ⚙</button>`;
    } else {
      btn = `<button disabled>材料不足 · ${t.price} ⚙</button>`;
    }
    card.innerHTML = `
      <div class="tank-top">
        <span class="dot" style="background:${t.color}"></span>
        <span>${t.name}</span>
        <span class="price">${owned ? '已拥有' : t.price + ' ⚙'}</span>
      </div>
      ${statBar('攻击', t.atk, 1.6)}
      ${statBar('防守', t.def, 1.6)}
      ${statBar('耐久', t.hp, 150)}
      <div class="tdesc">${t.desc}</div>
      ${btn}
    `;
    grid.appendChild(card);
  }
  grid.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => {
    const t = tankById(b.dataset.buy);
    if (save.coins >= t.price && !save.owned.includes(t.id)) {
      save.coins -= t.price;
      save.owned.push(t.id);
      save.selected = t.id;
      persist();
      renderShop();
      updateWallet();
    }
  }));
  grid.querySelectorAll('[data-use]').forEach(b => b.addEventListener('click', () => {
    save.selected = b.dataset.use;
    persist();
    renderShop();
  }));
}

function openShop() { renderShop(); document.getElementById('shop').style.display = 'flex'; }
function closeShop() { document.getElementById('shop').style.display = 'none'; }

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawSky();
  drawMountains();
  drawClouds();
  drawTerrain();
  const pAim = turn === 'player' ? angle : (ai.aimA || 120);
  drawTurret(player, pAim, player.color);
  const aAim = turn === 'ai' || ai.aimA ? (ai.aimA || 120) : 120;
  drawTurret(ai, aAim, ai.color);
  drawAim();
  if (projectile) drawProjectile();
  drawParticles();
  ctx.restore();

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(8,10,20,.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  const tg2 = ctx.createLinearGradient(0, 0, 0, 130);
  tg2.addColorStop(0, 'rgba(6,8,18,.5)');
  tg2.addColorStop(1, 'rgba(6,8,18,0)');
  ctx.fillStyle = tg2;
  ctx.fillRect(0, 0, W, 130);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (state !== 'gameover') update(dt);
  render();
  if (state !== 'gameover') updateHUD();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', (e) => {
  if (document.getElementById('shop').style.display === 'flex') return;
  if (state === 'aim' && turn === 'player') {
    if (e.key === 'ArrowLeft') { angle = Math.max(5, angle - 2); updateHUD(); }
    else if (e.key === 'ArrowRight') { angle = Math.min(85, angle + 2); updateHUD(); }
    else if (e.key === 'ArrowUp') { power = Math.min(MAX_POWER, power + 12); updateHUD(); }
    else if (e.key === 'ArrowDown') { power = Math.max(MIN_POWER, power - 12); updateHUD(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); fire(player, angle, power); }
  }
  if (e.key === 'r' || e.key === 'R') start();
});

document.getElementById('restart').addEventListener('click', start);
document.getElementById('shopBtn').addEventListener('click', openShop);
document.getElementById('closeShop').addEventListener('click', closeShop);
document.getElementById('shop').addEventListener('click', (e) => {
  if (e.target.id === 'shop') closeShop();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeShop();
});

updateWallet();
start();
requestAnimationFrame(loop);
</script>
</body>
</html>
