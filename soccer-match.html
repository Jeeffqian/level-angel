<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足球对决 - 6V6 2D 街机足球</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0f0a; font-family: 'Segoe UI','Microsoft YaHei',sans-serif; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; will-change: transform; }
#hud {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center; pointer-events: none; z-index: 50;
}
#hud .box {
  background: rgba(0,0,0,0.6); color: #fff; border-radius: 8px;
  padding: 6px 14px; text-align: center; border: 1px solid rgba(255,255,255,0.12);
  font-size: 11px; letter-spacing: 1px;
}
#hud .team { font-size: 9px; }
#hud .score { font-size: 28px; font-weight: 700; line-height: 1.1; min-width: 32px; }
#hud .time { font-size: 24px; font-weight: 700; color: #ffe066; padding: 6px 10px; }
#hud .blue { color: #4da6ff; } #hud .red { color: #ff5a5a; }
#bars {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; pointer-events: none; z-index: 50;
}
.bar-wrap { width: 100px; height: 10px; background: rgba(0,0,0,0.5); border-radius: 999px; overflow: hidden; }
.bar { height: 100%; transition: width .1s; }
#stam-bar { background: linear-gradient(90deg,#4da6ff,#7ab8ff); }
#pow-bar { background: linear-gradient(90deg,#ffd166,#ff8c42); display:none; }
#message {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #fff; font-size: 56px; font-weight: 800; pointer-events: none;
  text-shadow: 0 4px 22px rgba(0,0,0,0.7); display: none; z-index: 60;
  letter-spacing: 3px;
}
#start-screen {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: rgba(0,0,0,0.82);
  color: #fff; z-index: 100;
}
#start-screen h1 { font-size: 52px; color: #4da6ff; letter-spacing: 2px; text-shadow: 0 0 32px rgba(77,166,255,0.5); }
#start-screen h1 span { color: #ff5a5a; }
#start-screen h2 { font-size: 17px; color: #aaa; margin-top: 4px; letter-spacing: 1px; }
#start-screen .controls { margin-top: 20px; font-size: 13px; color: #888; line-height: 1.9; text-align: center; }
#start-screen .controls span { color: #4da6ff; font-weight: bold; }
.btn {
  margin-top: 24px; padding: 12px 42px; font-size: 16px; font-weight: bold;
  border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase;
  letter-spacing: 2px; background: linear-gradient(90deg,#37c76b,#22d3ee);
  color: #04110a; transition: all 0.2s; box-shadow: 0 6px 24px rgba(34,211,238,0.2);
}
.btn:hover { transform: scale(1.04); filter: brightness(1.06); }
#result {
  position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.88); color: #fff; z-index: 100;
}
#result h1 { font-size: 44px; margin-bottom: 8px; letter-spacing: 4px; }
#result .final { font-size: 32px; font-weight: 700; margin-bottom: 20px; letter-spacing: 6px; }
</style>
</head>
<body>
<div id="hud" style="display:none">
  <div class="box"><div class="team">蓝队</div><div class="score blue" id="score-blue">0</div></div>
  <div class="box time" id="timer">2:00</div>
  <div class="box"><div class="team">红队</div><div class="score red" id="score-red">0</div></div>
</div>
<div id="bars" style="display:none">
  <div class="bar-wrap"><div class="bar" id="stam-bar"></div></div>
  <div class="bar-wrap"><div class="bar" id="pow-bar"></div></div>
</div>
<div id="message"></div>
<div id="start-screen">
  <h1>足球<span>对决</span></h1>
  <h2>6V6 街机足球 · 守门员 + 队友 + 蓄力射门</h2>
  <div class="controls">
    <span>WASD / 方向键</span> 移动<br>
    <span>Shift</span> 冲刺（消耗体力）<br>
    <span>长按空格</span> 蓄力射门（松开发射）<br>
    自动换人：靠近球员即切换控制<br>
    120 秒内争夺进球！
  </div>
  <button class="btn" onclick="startGame()">开始比赛</button>
</div>
<div id="result">
  <h1 id="result-title">比赛结束</h1>
  <div class="final" id="result-score"></div>
  <button class="btn" onclick="location.reload()">再来一局</button>
</div>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function(){
  const PW=1100,PH=680,GOAL_H=200,GOAL_DEPTH=26,BALL_R=12,PLAYER_R=17,MATCH_TIME=120;
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const powBar=document.getElementById('pow-bar'),stamBar=document.getElementById('stam-bar');
  let scale=1,ox=0,oy=0,sx=0,sy=0,shake=0,state='idle',scoreBlue=0,scoreRed=0,timeLeft=MATCH_TIME;
  let keys={},lastTs=0,msgT=0,charging=false,chargeT=0,activePlayerIdx=0;
  const ball={x:PW/2,y:PH/2,vx:0,vy:0};
  // 12 名玩家：蓝队 6 名，红队 6 名
  const players=[]; // each: {id,team,role,x,y,vx,vy,face,kickCd,stam,controlled}
  function makePlayer(id,team,role,x,y){
    return {id,team,role, x,y, vx:0, vy:0, face:0, kickCd:0, stam:1, controlled:false};
  }
  function setupPlayers(){
    players.length=0;
    // 蓝队 (人类控制其中一名，其余 AI，自动换人)
    // GK
    players.push(makePlayer('b1','blue','gk',PW*0.15,PH/2));
    // DEF
    players.push(makePlayer('b2','blue','df',PW*0.22,PH/2-90));
    players.push(makePlayer('b3','blue','df',PW*0.22,PH/2+90));
    // MID
    players.push(makePlayer('b4','blue','md',PW*0.35,PH/2-40));
    players.push(makePlayer('b5','blue','md',PW*0.35,PH/2+40));
    // ST (human controlled initially)
    players.push(makePlayer('b6','blue','st',PW*0.52,PH/2));
    // 红队 (全 AI)
    // GK
    players.push(makePlayer('r1','red','gk',PW-0.15,PH/2));
    // DEF
    players.push(makePlayer('r2','red','df',PW*0.78,PH/2-90));
    players.push(makePlayer('r3','red','df',PW*0.78,PH/2+90));
    // MID
    players.push(makePlayer('r4','red','md',PW*0.65,PH/2-40));
    players.push(makePlayer('r5','red','md',PW*0.65,PH/2+40));
    // ST
    players.push(makePlayer('r6','red','st',PW*0.85,PH/2));
    // 设置角色职责
    const roles = {
      'gk': { chaseBall: false, goalLine: true, clearDist: 60 },
      'df': { chaseBall: true, shootGoal: true, shootDist: 50 },
      'md': { chaseBall: true, shootGoal: true, shootDist: 40 },
      'st': { chaseBall: true, shootGoal: true, shootDist: 30 }
    };
    // 设置初始位置与朝向
    // 蓝队
    players[0].face = 1; // GK 面向右
    players[1].face = 1; players[2].face = 1;
    players[3].face = 1; players[4].face = 1;
    players[5].face = 1; // ST
    players[5].controlled = true; // human 初始控制 ST
    // 红队
    players[6].face = -1; players[7].face = -1; players[8].face = -1;
    players[9].face = -1; players[10].face = -1;
    players[11].face = -1;
  }
  function resetBall(toBlue){
    ball.x=PW/2; ball.y=PH/2; ball.vx=toBlue?-220:220; ball.vy=(Math.random()-0.5)*140;
    // 重置所有 controlled 状态：将控制权交回给离球最近的蓝队队员
    let bestIdx=-1,bestD=1e9;
    for(let i=0;i<6;i++){ const p=players[i]; if(p.team==='blue'){ const d=Math.hypot(p.x-ball.x,p.y-ball.y); if(d<bestD){bestD=d; bestIdx=i;} } }
    // 只有一名队员被标记为 controlled
    for(let i=0;i<6;i++) players[i].controlled = (i===bestIdx);
    activePlayerIdx = bestIdx;
  }
  function resize(){
    const w=window.innerWidth,h=window.innerHeight;
    scale=Math.min(w/PW,h/PH);
    canvas.width=Math.floor(PW*scale); canvas.height=Math.floor(PH*scale);
    ox=(w-canvas.width)/2; oy=(h-canvas.height)/2;
    canvas.style.left=ox+'px'; canvas.style.top=oy+'px'; canvas.style.position='fixed';
  }
  function msg(t,ms){const m=document.getElementById('message');m.textContent=t;m.style.display='block';msgT=ms;}
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function inGoal(y){return y>PH/2-GOAL_H/2&&y<PH/2+GOAL_H/2;}
  // AI 更新
  function updateAI(dt){
    // 为每个红队队员更新 AI
    for(let i=6;i<12;i++){
      const p=players[i];
      // 确定最近的球队队员去追球
      let teammateBest=-1,teammateD=1e9;
      for(let j=6;j<12;j++){ if(j!==i){ const d=Math.hypot(players[j].x-ball.x,players[j].y-ball.y); if(d<teammateD){teammateD=d;teammateBest=j;} } }
      const target = teammateBest!==-1 ? players[teammateBest] : p; //  fallback

      // chase ball
      const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);
      if(d>300){ // 回归配合位置
        const tx=target.x+60*p.face, ty=target.y+(Math.random()-.5)*50;
        p.vx=(tx-p.x)*3.5; p.vy=(ty-p.y)*3.5; p.face=target.face;
      }else{
        p.vx=dx/(d||1)*280; p.vy=dy/(d||1)*280; p.face=dx>=-4?1:-1;
        if(d<PLAYER_R+BALL_R+8&&p.kickCd<=0){
          p.kickCd=0.5;
          // 射向蓝队球门 (x=0 附近)
          const gy=PH/2+(Math.random()-.5)*100;
          const gdx=-1,gdy=(gy-ball.y)/(PW*0.5);
          const l=Math.hypot(gdx,gdy)||1;
          const pow=500+Math.random()*120;
          ball.vx=gdx/l*pow; ball.vy=gdy/l*pow;
        }
      }
      p.vx=clamp(p.vx,-300,300); p.vy=clamp(p.vy,-300,300);
    }
    //蓝队 AI (非 controlled 玩家)
    for(let i=0;i<6;i++){
      const p=players[i];
      if(p.controlled||p.role==='gk') continue;
      // AI chase ball, simple
      const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);
      if(d>300){
        const tx=players[5].x+60*p.face, ty=players[5].y+(Math.random()-.5)*50;
        p.vx=(tx-p.x)*3.2; p.vy=(ty-p.y)*3.2; p.face=players[5].face;
      }else{
        p.vx=dx/(d||1)*260; p.vy=dy/(d||1)*260; p.face=dx>=-4?1:-1;
        if(d<PLAYER_R+BALL_R+8&&p.kickCd<=0){
          p.kickCd=0.5;
          const gy=PH/2+(Math.random()-.5)*100;
          const gdx=-1,gdy=(gy-ball.y)/(PW*0.5);
          const l=Math.hypot(gdx,gdy)||1;
          const pow=480+Math.random()*100;
          ball.vx=gdx/l*pow; ball.vy=gdy/l*pow;
        }
      }
      p.vx=clamp(p.vx,-300,300); p.vy=clamp(p.vy,-300,300);
    }
  }
  function updateHuman(dt){
    const h=players[5]; // human is always index 5 (blue ST)
    let mx=0,my=0;
    if(keys['KeyW']||keys['ArrowUp']) my-=1;
    if(keys['KeyS']||keys['ArrowDown']) my+=1;
    if(keys['KeyA']||keys['ArrowLeft']) mx-=1;
    if(keys['KeyD']||keys['ArrowRight']) mx+=1;
    if(mx||my){const l=Math.hypot(mx,my);mx/=l;my/=l;h.face=mx?Math.sign(mx):h.face;}
    let spd=320;
    const sprint=(keys['ShiftLeft']||keys['ShiftRight'])&&h.stam>.01;
    if(sprint){spd*=1.45;h.stam-=dt*0.35;}else h.stam+=dt*0.18;
    h.stam=clamp(h.stam,0,1);
    h.vx=mx*spd; h.vy=my*spd;
    // control switching: 当靠近其他蓝队队员时自动切换
    let bestIdx=-1,bestD=60; // 60px radius
    for(let i=0;i<6;i++){ const p=players[i]; if(i!==5&&p.team==='blue'){ const d=Math.hypot(p.x-h.x,p.y-h.y); if(d<bestD){bestD=d;bestIdx=i;} } }
    if(bestIdx!==-1&&bestD<40){ // 自动换人
      // 逐步过渡
      activePlayerIdx=bestIdx;
      for(let i=0;i<6;i++) players[i].controlled=(i===bestIdx);
      // 给新控制者一个轻微的速度助推，使其靠近球
      const np=players[bestIdx];
      const dx=ball.x-np.x,dy=ball.y-np.y;
      np.vx=dx/(Math.hypot(dx,dy)||1)*120; np.vy=dy/(Math.hypot(dx,dy)||1)*120;
    }
    // kick
    if(charging) chargeT+=dt;
    // 球员碰撞
    for(const p of players){
      if(p===h) continue; // skip self for collision handling below
      const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),m=BALL_R+PLAYER_R;
      if(d<m&&d>.001){const nx=dx/d,ny=dy/d;ball.x=p.x+nx*m;ball.y=p.y+ny*m;const push=Math.hypot(p.vx,p.vy);if(push>15){const dxv=p.vx/push,dyv=p.vy/push;ball.vx+=dxv*300*dt;ball.vy+=dyv*300*dt;}}
    }
    // 球与 human 碰撞 (带球/推球)
    const dx=ball.x-h.x,dy=ball.y-h.y,d=Math.hypot(dx,dy);
    if(d<BALL_R+PLAYER_R&&d>0.001){
      const nx=dx/d,ny=dy/d;ball.x=h.x+nx*(BALL_R+PLAYER_R);ball.y=h.y+ny*(BALL_R+PLAYER_R);
      const push=Math.hypot(h.vx,h.vy);
      if(push>15){const dxv=h.vx/push,dyv=h.vy/push;ball.vx+=dxv*320*dt;ball.vy+=dyv*320*dt;}
      if(h===activePlayerIdx&&keys['Space']&&h.kickCd<=0){
        shoot(h, ball, chargeT);
      }
    }
  }
  function shoot(powerMul){ // 统一射门函数
    const h=players[5]; if(h.kickCd>0) return;
    h.kickCd=.3;
    let dx=h.face,dy=0,spd=Math.hypot(h.vx,h.vy);
    if(spd>18){dx=h.vx/spd; dy=h.vy/spd; if(Math.abs(dx)<.25)dx=h.face;}
    const l=Math.hypot(dx,dy)||1; const pwr=520+powerMul*680;
    ball.vx=dx/l*pwr; ball.vy=dy/l*pwr;
  }
  function score(team){
    if(team==='blue') scoreBlue++; else scoreRed++;
    state='goal'; shake=.35;
    msg(team==='blue'?'GOAL!':'失球...',1200);
    setTimeout(()=>{
      if(state==='over') return;
      resetBall(team==='blue');
      setupPlayers(); // 重新布置阵容
      state='playing'; lastTs=performance.now();
    },1200);
  }
  function endMatch(){
    state='over'; document.getElementById('result').style.display='flex';
    const rt=document.getElementById('result-title'), rs=document.getElementById('result-score');
    if(scoreBlue>scoreRed){rt.textContent='你赢了！';rt.style.color='#4da6ff';}
    else if(scoreBlue<scoreRed){rt.textContent='红队获胜';rt.style.color='#ff5a5a';}
    else{rt.textContent='平局！';rt.style.color='#ffe066';}
    rs.textContent=scoreBlue+' : '+scoreRed;
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();
    sx=sy=0;if(shake>.001){sx=(Math.random()-.5)*12*shake;sy=(Math.random()-.5)*8*shake;shake*=.86;}ctx.translate(sx*scale,sy*scale);ctx.scale(scale,scale);
    drawGrass();drawLines();drawGoals();for(const p of players)drawShadow(p.x,p.y);
    drawShadow(ball.x,ball.y);drawBall();for(const p of players)drawPlayer(p);
    ctx.restore();
  }
  function drawGrass(){const g=ctx.createLinearGradient(0,0,0,PH);g.addColorStop(0,'#2f8f3f');g.addColorStop(1,'#267a35');ctx.fillStyle=g;ctx.fillRect(0,0,PW,PH);ctx.fillStyle='rgba(255,255,255,.03)';for(let i=0;i<10;i+=2)ctx.fillRect(0,i*(PH/10),PW,PH/10);}
  function drawLines(){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.strokeRect(8,8,PW-16,PH-16);
    ctx.beginPath();ctx.moveTo(PW/2,8);ctx.lineTo(PW/2,PH-8);ctx.stroke();
    ctx.beginPath();ctx.arc(PW/2,PH/2,70,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(PW/2,PH/2,4,0,Math.PI*2);ctx.fill();
    // 禁区
    const bw=140,bh=GOAL_H+150;ctx.strokeRect(8,PH/2-bh/2,bw,bh);ctx.strokeRect(PW-8-bw,PH/2-bh/2,bw,bh);
    const bw2=66,bh2=GOAL_H+36;ctx.strokeRect(8,PH/2-bh2/2,bw2,bh2);ctx.strokeRect(PW-8-bw2,PH/2-bh2/2,bw2,bh2);
    ctx.beginPath();ctx.arc(8+108,PH/2,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(PW-8-108,PH/2,3,0,Math.PI*2);ctx.fill();
  }
  function drawGoals(){function g(x,cy){ctx.strokeStyle='#fff';ctx.lineWidth=3;const sx=x===0?-GOAL_DEPTH:PW;ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(sx,cy-GOAL_H/2,GOAL_DEPTH,GOAL_H);ctx.strokeRect(sx,cy-GOAL_H/2,GOAL_DEPTH,GOAL_H);ctx.fillStyle='#fff';ctx.fillRect(x===0?-2:PW-2,cy-GOAL_H/2-6,4,12);ctx.fillRect(x===0?-2:PW-2,cy+GOAL_H/2-6,4,12);}g(0,PH/2);g(PW,PH/2);}
  function drawShadow(x,y){ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y+5,14,4,0,0,Math.PI*2);ctx.fill();}
  function drawBall(){const sp=Math.hypot(ball.vx,ball.vy);ctx.save();ctx.translate(ball.x,ball.y);if(sp>380){ctx.shadowBlur=12;ctx.shadowColor='rgba(255,255,255,.5)';}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,BALL_R,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
  function drawPlayer(p){
    const blue=p.team==='blue',col=blue?'#4da6ff':'#ff5a5a',dark=blue?'#255fb8':'#b63a3a';
    const isCtrl=p===players[5]; // human is index 5
    ctx.save();ctx.translate(p.x,p.y);
    // 高亮被控制者
    if(isCtrl){ctx.strokeStyle='rgba(255,255,255,.96)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,PLAYER_R+5,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,PLAYER_R,0,Math.PI*2);ctx.fill();ctx.strokeStyle=dark;ctx.lineWidth=2.5;ctx.stroke();
    // 朝向箭头
    const fx=p.face;ctx.fillStyle=dark;ctx.beginPath();ctx.arc(fx*8,6,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(fx*8,-6,5,0,Math.PI*2);ctx.fill();
    // 数字/角色标识
    if(blue&&isCtrl){ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('你',0,2);}
    if(!blue&&p.role==='gk'){ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText('GK',0,4);}
    // 体能条小图（可选省略）
    ctx.restore();
  }
  function updateHUD(){
    document.getElementById('score-blue').textContent=scoreBlue;
    document.getElementById('score-red').textContent=scoreRed;
    const m=Math.floor(timeLeft/60),s=Math.ceil(timeLeft%60); document.getElementById('timer').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    // 体力条
    const h=players[5];stamBar.style.width=(h?h.stam*100:100)+'%';
    const pm=charging?clamp(chargeT/.55,0,1):0;powBar.style.width=(pm*100)+'%';powBar.style.display=charging?'block':'none';
  }
  function startGame(){
    document.getElementById('start-screen').style.display='none';
    document.getElementById('hud').style.display='flex';
    document.getElementById('bars').style.display='flex';
    scoreBlue=0;scoreRed=0;timeLeft=MATCH_TIME;
    setupPlayers(); resetBall(true); state='playing'; lastTs=performance.now();
    msg('开球！',900);
  }
  // 主循环
  function loop(ts){
    const dt=Math.min((ts-lastTs)/1000,.05); lastTs=ts;
    if(state==='playing'){
      timeLeft-=dt; if(timeLeft<=0){timeLeft=0;endMatch();}
      updateHuman(dt); updateAI(dt); updateHUD();
    }
    if(msgT>0){msgT-=dt*1000;if(msgT<=0)document.getElementById('message').style.display='none';}
    draw(); requestAnimationFrame(loop);
  }
  window.addEventListener('keydown',e=>{
    keys[e.code]=true;if(e.code==='Space'&&!charging){charging=true;chargeT=0;}});
  window.addEventListener('keyup',e=>{
    keys[e.code]=false;if(e.code==='Space'&&charging){shoot();charging=false;chargeT=0;}});
  window.addEventListener('resize',resize);resize();lastTs=performance.now();requestAnimationFrame(loop);
  window.startGame=startGame;
})();
</script>
