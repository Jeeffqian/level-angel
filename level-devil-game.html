<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Angel - 关卡游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }
        
        .game-container {
            position: relative;
            border: 4px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e94560;
            font-size: 24px;
            text-shadow: 2px 2px 0px #000;
            line-height: 1.6;
        }
        
        .ui .time-display {
            font-size: 16px;
            line-height: 1.5;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #eee;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        .death-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        .death-screen h1 {
            color: #e94560;
            font-size: 48px;
            text-shadow: 2px 2px 0px #000;
        }
        
        #respawnBtn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: #e94560;
            color: #fff;
            border: 3px solid #000;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        
        #respawnBtn:hover {
            background: #ff5c77;
        }
        
        #operatorBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 14px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: #222244;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            z-index: 11;
        }
        
        #operatorBtn:hover {
            background: #2a2a55;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 20, 0.92);
            z-index: 20;
        }
        
        .overlay h2 {
            color: #00ffcc;
            font-size: 28px;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 20px;
        }
        
        #passDisplay {
            color: #fff;
            font-size: 30px;
            letter-spacing: 10px;
            background: #111122;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            padding: 8px 20px;
            margin-bottom: 15px;
            min-width: 200px;
            text-align: center;
        }
        
        .passpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .pass-key {
            height: 50px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: #222244;
            color: #fff;
            border: 2px solid #444466;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .pass-key:hover {
            background: #333366;
        }
        
        .pass-key.wide {
            grid-column: span 1;
        }
        
        #passError {
            color: #ff3355;
            font-size: 16px;
            min-height: 20px;
            margin-bottom: 10px;
        }
        
        .op-grid {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .op-cell {
            height: 55px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: #222244;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
        }
        
        .op-cell:hover {
            background: #2a2a55;
        }
        
        .overlay-close {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            background: #444;
            color: #fff;
            border: 2px solid #666;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #menuScreen {
            z-index: 30;
        }
        
        .menu-title {
            color: #ffd700;
            font-size: 72px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-shadow: 4px 4px 0px #000;
            margin-bottom: 50px;
            letter-spacing: 4px;
        }
        
        .menu-btn {
            width: 260px;
            margin: 12px 0;
            padding: 16px 0;
            font-size: 26px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: #222244;
            color: #fff;
            border: 3px solid #e94560;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
        
        .menu-btn:hover {
            background: #2a2a55;
            color: #ffd700;
        }
        
        #onlineScreen {
            z-index: 30;
        }
        
        #onlineScreen h2 {
            color: #00ffcc;
            font-size: 30px;
            margin-bottom: 10px;
        }
        
        .name-input {
            width: 240px;
            padding: 10px 14px;
            font-size: 22px;
            font-family: 'Courier New', monospace;
            text-align: center;
            background: #111122;
            color: #fff;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            margin-bottom: 20px;
            outline: none;
        }
        
        .status-text {
            color: #ffd700;
            font-size: 20px;
            min-height: 30px;
            margin: 10px 0;
        }
        
        .countdown {
            color: #ffd700;
            font-size: 80px;
            font-weight: bold;
            text-shadow: 4px 4px 0px #000;
            margin: 10px 0;
        }
        
        .menu-btn-sm {
            width: 200px;
            padding: 10px 0;
            font-size: 18px;
        }
        
        .skin-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 8px 0;
            width: 420px;
        }
        
        .skin-label {
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 16px;
            margin-bottom: 2px;
        }
        
        .skin-cell {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            border: 3px solid #000;
            cursor: pointer;
            position: relative;
            box-shadow: 2px 2px 0px #000;
        }
        
        .skin-cell.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .skin-cell.selected {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.9);
        }
        
        .skin-cell .lock {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        
        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 420px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .ach-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111122;
            border: 2px solid #333355;
            border-radius: 6px;
            padding: 10px 14px;
        }
        
        .ach-row.done {
            border-color: #ffd700;
        }
        
        .ach-name {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        
        .ach-desc {
            color: #8899aa;
            font-size: 13px;
        }
        
        .ach-badge {
            color: #ffd700;
            font-size: 22px;
        }
        
        #touchControls {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 15;
        }
        
        .tc-btn {
            position: absolute;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        
        .tc-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }
        
        #tcP1Left { left: 16px; bottom: 90px; }
        #tcP1Right { left: 96px; bottom: 90px; }
        .tc-jump#tcP1Jump { right: 24px; bottom: 90px; background: rgba(233, 69, 96, 0.3); }
        #tcP2Left { left: 16px; bottom: 170px; }
        #tcP2Right { left: 96px; bottom: 170px; }
        .tc-jump#tcP2Jump { right: 24px; bottom: 170px; background: rgba(255, 204, 0, 0.3); }
        .tc-p2 { border-color: rgba(255, 204, 0, 0.7); color: #ffcc00; }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
        <div class="ui">
            <div id="levelLabel">LEVEL 1</div>
            <div class="time-display" id="timeDisplay">当前 0.0s</div>
            <div class="time-display" id="levelTimeDisplay"></div>
        </div>
        <div class="death-screen" id="deathScreen">
            <h1>你死了</h1>
            <button id="respawnBtn">重生</button>
        </div>
        <button id="operatorBtn">operator mode</button>
        <div class="overlay" id="passLock">
            <h2>输入密码</h2>
            <div id="passDisplay"></div>
            <div id="passError"></div>
            <div class="passpad" id="passpad"></div>
            <button class="overlay-close" id="passClose">取消</button>
        </div>
        <div class="overlay" id="operatorPanel">
            <h2>OPERATOR MODE</h2>
            <div class="op-grid" id="opGrid"></div>
            <button class="overlay-close" id="opClose">关闭</button>
        </div>
        <div class="controls">
            P1: W跳 A左 D右 | P2: ↑跳 ←左 →右
        </div>
        <div id="touchControls" style="display:none;">
            <div class="tc-btn" id="tcP1Left">◀</div>
            <div class="tc-btn" id="tcP1Right">▶</div>
            <div class="tc-btn tc-jump" id="tcP1Jump">▲</div>
            <div class="tc-btn tc-p2" id="tcP2Left">◀</div>
            <div class="tc-btn tc-p2" id="tcP2Right">▶</div>
            <div class="tc-btn tc-jump tc-p2" id="tcP2Jump">▲</div>
        </div>
        <div class="overlay" id="menuScreen" style="display: flex;">
            <div class="menu-title">Level Angel</div>
            <button class="menu-btn" id="singleBtn">单人模式</button>
            <button class="menu-btn" id="dualBtn">双人模式</button>
            <button class="menu-btn" id="onlineBtn">Online 模式</button>
            <button class="menu-btn menu-btn-sm" id="skinBtn">角色皮肤</button>
            <button class="menu-btn menu-btn-sm" id="achievementBtn">成就</button>
        </div>
        <div class="overlay" id="skinScreen">
            <h2>角色皮肤</h2>
            <div class="skin-row" id="skinP1Row"></div>
            <div class="skin-row" id="skinP2Row"></div>
            <button class="overlay-close" id="skinClose">返回</button>
        </div>
        <div class="overlay" id="achievementScreen">
            <h2>成就</h2>
            <div class="achievement-list" id="achievementList"></div>
            <button class="overlay-close" id="achievementClose">返回</button>
        </div>
        <div class="overlay" id="onlineScreen">
            <h2>ONLINE 联机</h2>
            <input class="name-input" id="nameInput" maxlength="16" placeholder="输入你的名字" />
            <input class="name-input" id="roomCodeInput" maxlength="5" placeholder="5位数字房间码" style="display:none;" />
            <button class="menu-btn" id="createRoomBtn">创建房间</button>
            <button class="menu-btn" id="joinRoomBtn">加入房间</button>
            <div class="status-text" id="onlineStatus"></div>
            <div class="countdown" id="countdown" style="display:none;"></div>
            <button class="overlay-close" id="onlineClose">返回</button>
        </div>
    </div>

    <script src="peerjs.min.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const PIXEL_SIZE = 32;
        const GRAVITY = 0.8;
        const JUMP_FORCE = -15;
        const MOVE_SPEED = 8;
        const HOLE_TIME = 180;
        const CHASE_SPEED = 7;
        
        // ===== 音效（Web Audio 实时合成）=====
        const SND = (() => {
            let ac = null;
            function ctx() {
                if (!ac) {
                    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
                }
                if (ac && ac.state === 'suspended') ac.resume();
                return ac;
            }
            function tone(freq, dur, type, vol) {
                const c = ctx();
                if (!c) return;
                const o = c.createOscillator();
                const g = c.createGain();
                o.type = type || 'square';
                o.frequency.value = freq;
                o.connect(g); g.connect(c.destination);
                const t = c.currentTime;
                g.gain.setValueAtTime(vol || 0.08, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.start(t); o.stop(t + dur + 0.02);
            }
            return {
                unlockAc: () => ctx(),
                jump() { tone(420, 0.1, 'square', 0.07); },
                death() { tone(140, 0.32, 'sawtooth', 0.12); },
                win() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'square', 0.1), i * 120)); },
                unlock() { [660, 880].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.09), i * 100)); },
                select() { tone(300, 0.06, 'square', 0.06); }
            };
        })();
        
        const keys1 = { w: false, a: false, d: false, s: false };
        const keys2 = { w: false, a: false, d: false, s: false };
        
        let mode = 'menu';
        let score1 = 0;
        let score2 = 0;
        let currentLevel = 1;
        let holeTriggered = false;
        let activeHoles = [];
        let gameComplete = false;
        let dead = false;
        let chaseActive = false;
        let chaseFront = 0;
        let nextTrapHole = 0;
        let movingPlatforms = [];
        let vanishingPlatforms = [];
        let portals = [];
        let gravityZone = null;
        let controlsInverted = false;
        let iceMode = false;
        let levelStartTime = 0;
        let levelRecorded = false;
        let levelScored = false;
        const levelTimes = {};
        const TOTAL_LEVELS = 20;
        
        // ===== 存档、皮肤、成就、计时赛 =====
        const SAVE_KEY = 'levelAngelSave';
        const SKINS = [
            { id: 'red', name: '经典红', color: '#e94560', unlock: 0 },
            { id: 'yellow', name: '经典黄', color: '#ffcc00', unlock: 0 },
            { id: 'blue', name: '海洋蓝', color: '#3b82f6', unlock: 3 },
            { id: 'green', name: '翡翠绿', color: '#22c55e', unlock: 6 },
            { id: 'purple', name: '紫罗兰', color: '#a855f7', unlock: 9 },
            { id: 'gold', name: '黄金', color: '#f59e0b', unlock: 12 },
            { id: 'cyan', name: '极光青', color: '#06b6d4', unlock: 15 },
            { id: 'pink', name: '樱花粉', color: '#ec4899', unlock: 18 }
        ];
        const ACHIEVEMENTS = [
            { id: 'first', name: '初次启程', desc: '通过第 1 关' },
            { id: 'halfway', name: '渐入佳境', desc: '通过第 10 关' },
            { id: 'master', name: '通关大师', desc: '通关全部 20 关' },
            { id: 'speed5', name: '闪电侠', desc: '任意一关 5 秒内通关' },
            { id: 'speed3', name: '极速传说', desc: '任意一关 3 秒内通关' }
        ];
        let saveData = { bestTimes: {}, skin1: 'red', skin2: 'yellow', unlocked: {}, achievements: {} };
        function loadSave() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    saveData = Object.assign({ bestTimes: {}, skin1: 'red', skin2: 'yellow', unlocked: {}, achievements: {} }, d);
                }
            } catch (e) {}
        }
        function saveSave() {
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) {}
        }
        function maxUnlocked() {
            let m = 0;
            for (const k in saveData.bestTimes) {
                const n = parseInt(k, 10);
                if (n > m) m = n;
            }
            return m;
        }
        function isSkinUnlocked(s) {
            if (s.unlock <= 0) return true;
            return maxUnlocked() >= s.unlock;
        }
        function checkAchievements() {
            const unlocked = maxUnlocked();
            const anyBest = (fn) => {
                for (const k in saveData.bestTimes) {
                    if (fn(saveData.bestTimes[k])) return true;
                }
                return false;
            };
            const checks = {
                first: unlocked >= 1,
                halfway: unlocked >= 10,
                master: unlocked >= 20,
                speed5: anyBest(t => t <= 5),
                speed3: anyBest(t => t <= 3)
            };
            let changed = false;
            for (const a of ACHIEVEMENTS) {
                if (checks[a.id] && !saveData.achievements[a.id]) {
                    saveData.achievements[a.id] = Date.now();
                    changed = true;
                    SND.unlock();
                }
            }
            if (changed) saveSave();
        }
        function applySkins() {
            const s1 = SKINS.find(s => s.id === saveData.skin1) || SKINS[0];
            const s2 = SKINS.find(s => s.id === saveData.skin2) || SKINS[1];
            player1.color = s1.color;
            player2.color = s2.color;
        }
        function skinColor(id) {
            const s = SKINS.find(s => s.id === id);
            return s ? s.color : SKINS[0].color;
        }
        
        let onlineRole = null;
        let remoteKeys = { w: false, a: false, d: false, s: false };
        let onlinePeer = null;
        let onlineConn = null;
        let onlineJoined = false;
        let onlineStarted = false;
        let myName = '';
        let roomCode = '';
        
        const platforms = [];
        const spikes = [];
        const springs = [];
        const conveyors = [];
        const fallingPlatforms = [];
        
        function resetPlayerTo(p) {
            p.x = 100;
            p.y = canvas.height - PIXEL_SIZE - PIXEL_SIZE * 2;
            p.velX = 0;
            p.velY = 0;
            p.gravityFlipped = false;
            p.finished = false;
        }
        
        function resetPlayers() {
            resetPlayerTo(player1);
            resetPlayerTo(player2);
        }
        
        function activePlayers() {
            return (mode === 'dual' || mode === 'online') ? [player1, player2] : [player1];
        }
        
        function inputFor(p) {
            if (mode === 'online') {
                if (onlineRole === 'p1') {
                    return p === player1 ? keys1 : remoteKeys;
                } else {
                    return p === player2 ? keys2 : remoteKeys;
                }
            }
            return p === player1 ? keys1 : keys2;
        }
        
        function sendMyInput() {
            if (!onlineConn || !onlineConn.open) return;
            const k = onlineRole === 'p1' ? keys1 : keys2;
            onlineConn.send(JSON.stringify({
                type: 'input',
                keys: { w: k.w, a: k.a, d: k.d, s: k.s }
            }));
        }
        
        const player1 = {
            x: 100,
            y: canvas.height - PIXEL_SIZE - PIXEL_SIZE * 2,
            width: PIXEL_SIZE,
            height: PIXEL_SIZE * 2,
            velX: 0,
            velY: 0,
            onGround: false,
            color: '#e94560',
            gravityFlipped: false,
            finished: false
        };
        
        const player2 = {
            x: 100,
            y: canvas.height - PIXEL_SIZE - PIXEL_SIZE * 2,
            width: PIXEL_SIZE,
            height: PIXEL_SIZE * 2,
            velX: 0,
            velY: 0,
            onGround: false,
            color: '#ffcc00',
            gravityFlipped: false,
            finished: false
        };
        
        function isInHole(x, y, w, h) {
            if (currentLevel === 3 && chaseActive) {
                if (x + w <= chaseFront &&
                    y < canvas.height - PIXEL_SIZE + PIXEL_SIZE * 20 &&
                    y + h > canvas.height - PIXEL_SIZE) {
                    return true;
                }
            }
            for (const hole of activeHoles) {
                if (x < hole.x + hole.width &&
                    x + w > hole.x &&
                    y < hole.y + hole.height &&
                    y + h > hole.y) {
                    return true;
                }
            }
            return false;
        }
        
        function loadLevel(n) {
            currentLevel = n;
            holeTriggered = false;
            activeHoles = [];
            gameComplete = false;
            dead = false;
            levelScored = false;
            chaseActive = false;
            chaseFront = 0;
            nextTrapHole = 200;
            movingPlatforms = [];
            vanishingPlatforms = [];
            portals = [];
            gravityZone = null;
            controlsInverted = false;
            iceMode = false;
            platforms.length = 0;
            spikes.length = 0;
            springs.length = 0;
            conveyors.length = 0;
            fallingPlatforms.length = 0;
            
            for (let x = 0; x < canvas.width; x += PIXEL_SIZE) {
                platforms.push({
                    x, y: canvas.height - PIXEL_SIZE,
                    width: PIXEL_SIZE, height: PIXEL_SIZE, color: '#16213e'
                });
            }
            
            if (n === 1) {
                for (let x = 200; x < 350; x += PIXEL_SIZE) {
                    platforms.push({
                        x, y: canvas.height - PIXEL_SIZE * 3,
                        width: PIXEL_SIZE, height: PIXEL_SIZE, color: '#0f3460'
                    });
                }
                for (let x = 500; x < 650; x += PIXEL_SIZE) {
                    platforms.push({
                        x, y: canvas.height - PIXEL_SIZE * 4,

        function drawPixelRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 1, y + 1, width - 2, height - 2);
        }

            ctx.fillStyle = '#000';

                ctx.fillStyle = '#8b0000';
                for (let x = 0; x < hole.width; x += PIXEL_SIZE) {
                    ctx.fillRect(hole.x + x, hole.y, PIXEL_SIZE, 8);
                }
                
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 3;
                ctx.strokeRect(hole.x + 2, hole.y + 2, hole.width - 4, hole.height - 4);
            }
        }
        
        function spawnHoleInFrontOfPlayer(p) {
            const frontTile = Math.floor((p.x + p.width + 10) / PIXEL_SIZE);
            const holeWidth = PIXEL_SIZE * 3;
            activeHoles.push({
                x: frontTile * PIXEL_SIZE,
                y: canvas.height - PIXEL_SIZE,
                width: holeWidth,
                height: PIXEL_SIZE * 20,
                timer: HOLE_TIME
            });
            holeTriggered = true;
        }
        
        function updateHoles() {
            for (let i = activeHoles.length - 1; i >= 0; i--) {
                activeHoles[i].timer--;
                if (activeHoles[i].timer <= 0) {
                    activeHoles.splice(i, 1);
                }
            }
        }
        
        function spawnHole(x, width, timer) {
            activeHoles.push({
                x,
                y: canvas.height - PIXEL_SIZE,
                width,
                height: PIXEL_SIZE * 20,
                timer
            });
        }
        
        function updateLevel2Trap() {
            if (currentLevel !== 2) return;
            if (holeTriggered) return;
            for (const p of activePlayers()) {
                if (!p.finished && p.x >= 380) {
                    spawnHoleInFrontOfPlayer(p);
                    break;
                }
            }
        }
        
        function isPlayerOverHole(x, y, w, h) {
            for (const hole of activeHoles) {
                if (x < hole.x + hole.width && x + w > hole.x &&
                    y < hole.y + hole.height && y + h > hole.y) {
                    return true;
                }
            }
            return false;
        }
        
        function updateLevel3() {
            if (currentLevel !== 3) return;
            const runners = activePlayers().filter(p => !p.finished);
            if (runners.length === 0) return;
            let rearmost = runners[0];
            for (const p of runners) {
                if (p.x < rearmost.x) rearmost = p;
            }
            if (!chaseActive) {
                if (rearmost.x > 130) {
                    chaseActive = true;
                    chaseFront = rearmost.x - PIXEL_SIZE;
                }
                return;
            }
            chaseFront += CHASE_SPEED;
            for (const p of runners) {
                if (p.x + p.width <= chaseFront) {
                    handlePlayerDeath(p);
                }
            }
            while (nextTrapHole > 0 && chaseFront >= nextTrapHole) {
                nextTrapHole += PIXEL_SIZE * 8;
                if (nextTrapHole < canvas.width - PIXEL_SIZE * 6) {
                    spawnHole(nextTrapHole, PIXEL_SIZE * 3, 60);
                }
            }
        }
        
        function updateMovingPlatforms() {
            for (const mp of movingPlatforms) {
                mp.x += mp.dir * mp.speed;
                if (mp.x > mp.maxX) {
                    mp.x = mp.maxX;
                    mp.dir = -1;
                }
                if (mp.x < mp.minX) {
                    mp.x = mp.minX;
                    mp.dir = 1;
                }
            }
        }
        
        function updateSpikes() {
            for (const sp of spikes) {
                if (sp.minX !== undefined && sp.maxX !== undefined) {
                    sp.x += sp.dir * sp.speed;
                    if (sp.x > sp.maxX) { sp.x = sp.maxX; sp.dir = -1; }
                    if (sp.x < sp.minX) { sp.x = sp.minX; sp.dir = 1; }
                }
            }
        }
        
        function updateFalling() {
            for (const fp of fallingPlatforms) {
                if (fp.fallen) continue;
                if (fp.touchedAt !== -1 && performance.now() - fp.touchedAt >= 260) {
                    fp.fallen = true;
                }
            }
        }
        
        function spikeAt(x, y, w, h) {
            for (const sp of spikes) {
                if (x < sp.x + sp.w && x + w > sp.x &&
                    y < sp.y + sp.h && y + h > sp.y) {
                    return sp;
                }
            }
            return null;
        }
        
        function springAt(x, y, w, h) {
            for (const sp of springs) {
                if (x < sp.x + sp.w && x + w > sp.x &&
                    y < sp.y + sp.h && y + h > sp.y) {
                    return sp;
                }
            }
            return null;
        }
        
        function conveyorAt(x, y, w, h) {
            for (const cv of conveyors) {
                if (x < cv.x + cv.w && x + w > cv.x &&
                    y < cv.y + cv.h && y + h > cv.y) {
                    return cv;
                }
            }
            return null;
        }
        
        function isFallingPlatform(x, y) {
            for (const fp of fallingPlatforms) {
                if (x >= fp.x0 && x < fp.x0 + fp.w && Math.abs(fp.y - y) < 1) {
                    return fp;
                }
            }
            return null;
        }
        
        function isFallen(x, y) {
            const fp = isFallingPlatform(x, y);
            return !!fp && fp.fallen;
        }
        
        function markFallingTouched(x, y) {
            const fp = isFallingPlatform(x, y);
            if (fp && fp.touchedAt === -1) {
                fp.touchedAt = performance.now();
            }
        }
        
        function findVanishingGroup(x, y) {
            for (const vp of vanishingPlatforms) {
                if (x >= vp.x0 && x < vp.x0 + vp.w && Math.abs(vp.y - y) < 1) {
                    return vp;
                }
            }
            return null;
        }
        
        function isVanishingPlatform(x, y) {
            return findVanishingGroup(x, y) !== null;
        }
        
        function getVanishingPlatform(x, y) {
            return findVanishingGroup(x, y);
        }
        
        function isVanished(x, y) {
            const vp = findVanishingGroup(x, y);
            if (!vp) return false;
            return vp.touchedAt !== -1 && performance.now() - vp.touchedAt >= 300;
        }
        
        function markVanishingTouched(x, y) {
            const vp = findVanishingGroup(x, y);
            if (vp && vp.touchedAt === -1) {
                vp.touchedAt = performance.now();
            }
        }
        
        function updateVanishing() {
            if (currentLevel !== 7) return;
        }
        
        function updateGravityZone() {
            for (const p of activePlayers()) {
                p.gravityFlipped = false;
                if (gravityZone) {
                    const cx = p.x + p.width / 2;
                    p.gravityFlipped = cx > gravityZone.x && cx < gravityZone.x + gravityZone.w;
                }
            }
        }
        
        function handlePlayerDeath(p) {
            SND.death();
            if (mode === 'single') {
                dead = true;
            } else if (currentLevel === 3) {
                resetPlayerTo(p);
                chaseActive = false;
                chaseFront = 0;
                nextTrapHole = 200;
                activeHoles = [];
            } else {
                resetPlayerTo(p);
            }
        }
        
        function stepPlayer(p, k) {
            if (iceMode) {
                if (k.a) {
                    p.velX -= MOVE_SPEED * 0.06;
                } else if (k.d) {
                    p.velX += MOVE_SPEED * 0.06;
                } else {
                    p.velX *= 0.92;
                }
                if (p.velX > MOVE_SPEED) p.velX = MOVE_SPEED;
                if (p.velX < -MOVE_SPEED) p.velX = -MOVE_SPEED;
                if (Math.abs(p.velX) < 0.1) p.velX = 0;
            } else if (k.a) {
                p.velX = controlsInverted ? MOVE_SPEED : -MOVE_SPEED;
            } else if (k.d) {
                p.velX = controlsInverted ? -MOVE_SPEED : MOVE_SPEED;
            } else {
                p.velX = 0;
            }
            
            if (k.w && p.onGround) {
                p.velY = p.gravityFlipped ? -JUMP_FORCE : JUMP_FORCE;
                p.onGround = false;
                SND.jump();
            }
            
            p.velY += p.gravityFlipped ? -GRAVITY : GRAVITY;
            
            p.x += p.velX;
            p.y += p.velY;
            
            p.onGround = false;
            
            for (const platform of platforms) {
                if (isInHole(platform.x, platform.y, platform.width, platform.height)) continue;
                if (isVanished(platform.x, platform.y)) continue;
                if (isFallen(platform.x, platform.y)) continue;
                
                if (p.x < platform.x + platform.width &&
                    p.x + p.width > platform.x &&
                    p.y < platform.y + platform.height &&
                    p.y + p.height > platform.y) {
                    
                    if (!p.gravityFlipped && p.velY > 0 && p.y + p.height - p.velY <= platform.y + 10) {
                        p.y = platform.y - p.height;
                        p.velY = 0;
                        p.onGround = true;
                        markVanishingTouched(platform.x, platform.y);
                        markFallingTouched(platform.x, platform.y);
                    }
                    if (p.gravityFlipped && p.velY < 0 && p.y - p.velY >= platform.y + platform.height - 10) {
                        p.y = platform.y + platform.height;
                        p.velY = 0;
                        p.onGround = true;
                    }
                }
            }
            
            for (const mp of movingPlatforms) {
                if (p.x < mp.x + mp.w &&
                    p.x + p.width > mp.x &&
                    p.y < mp.y + mp.h &&
                    p.y + p.height > mp.y) {
                    
                    if (p.velY > 0 && p.y + p.height - p.velY <= mp.y + 10) {
                        p.y = mp.y - p.height;
                        p.velY = 0;
                        p.onGround = true;
                        p.x += mp.dir * mp.speed;
                    }
                }
            }
            
            // 尖刺：触碰即死亡
            if (spikeAt(p.x, p.y, p.width, p.height)) {
                handlePlayerDeath(p);
                return;
            }
            
            // 传送带：站在上面被推动
            const cv = conveyorAt(p.x, p.y, p.width, p.height);
            if (cv && p.onGround) {
                p.x += cv.dir * 3.5;
            }
            
            // 弹簧：踩到即弹跳
            const spg = springAt(p.x, p.y, p.width, p.height);
            if (spg && !p.gravityFlipped && p.velY >= 0) {
                p.velY = spg.force;
                p.onGround = false;
            }
            
            if (p.x < 0) p.x = 0;
            if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;
            
            if (p.gravityFlipped ? p.y < -PIXEL_SIZE * 2 : p.y > canvas.height + PIXEL_SIZE * 2) {
                handlePlayerDeath(p);
            }
            
            for (const portal of portals) {
                if (p.x < portal.x + portal.w &&
                    p.x + p.width > portal.x &&
                    p.y < portal.y + portal.h &&
                    p.y + p.height > portal.y) {
                    p.x = portal.tx;
                    p.y = portal.ty;
                    p.velX = 0;
                    p.velY = 0;
                }
            }
        }
        
        function overlaps(p, r) {
            return p.x < r.x + r.width &&
                p.x + p.width > r.x &&
                p.y < r.y + r.height &&
                p.y + p.height > r.y;
        }
        
        function handleExits() {
            for (const p of activePlayers()) {
                if (p.finished) continue;
                const ex = (currentLevel === 4) ? leftExit : elevator;
                if (overlaps(p, ex)) {
                    onPlayerReachedExit(p);
                }
            }
        }
        
        function onPlayerReachedExit(p) {
            if (mode === 'single') {
                advanceLevel();
            } else {
                p.finished = true;
                if (!levelScored) {
                    levelScored = true;
                    if (p === player1) score1++;
                    else score2++;
                }
                if (player1.finished && player2.finished) {
                    advanceLevel();
                }
            }
        }
        
        function advanceLevel() {
            recordLevelTime();
            if (currentLevel < TOTAL_LEVELS) {
                SND.win();
                loadLevel(currentLevel + 1);
            } else {
                gameComplete = true;
            }
        }
        
        function update() {
            if (mode === 'menu' || gameComplete || dead) return;
            if (document.getElementById('passLock').style.display === 'flex' ||
                document.getElementById('operatorPanel').style.display === 'flex') return;
            
            updateGravityZone();
            
            for (const p of activePlayers()) {
                if (p.finished) {
                    p.velX = 0;
                    p.velY = 0;
                    continue;
                }
                stepPlayer(p, inputFor(p));
            }
            
            updateLevel2Trap();
            updateLevel3();
            updateMovingPlatforms();
            updateSpikes();
            updateFalling();
            updateHoles();
            updateVanishing();
            
            handleExits();
            
            if (mode === 'online' && onlineStarted) {
                sendMyInput();
            }
        }
        
        function recordLevelTime() {
            if (levelRecorded) return;
            levelRecorded = true;
            const t = (performance.now() - levelStartTime) / 1000;
            levelTimes[currentLevel] = t;
            if (mode === 'single') {
                if (saveData.bestTimes[currentLevel] === undefined || t < saveData.bestTimes[currentLevel]) {
                    saveData.bestTimes[currentLevel] = t;
                    saveSave();
                }
                checkAchievements();
            }
        }
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (mode === 'menu') return;
            
            if (gravityZone) {
                ctx.fillStyle = 'rgba(170, 136, 255, 0.15)';
                ctx.fillRect(gravityZone.x, gravityZone.y, gravityZone.w, gravityZone.h);
                ctx.strokeStyle = 'rgba(200, 180, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.strokeRect(gravityZone.x + 1, gravityZone.y + 1, gravityZone.w - 2, gravityZone.h - 2);
                for (let i = 0; i < 3; i++) {
                    const bx = gravityZone.x + 40 + i * 100;
                    const phase = (performance.now() / 300 + i * 0.6) % 1;
                    const by = gravityZone.y + 40 + phase * (gravityZone.h - 80);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.beginPath();
                    ctx.moveTo(bx - 10, by + 16);
                    ctx.lineTo(bx + 10, by + 16);
                    ctx.lineTo(bx, by - 6);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            
            for (const platform of platforms) {
                if (isInHole(platform.x, platform.y, platform.width, platform.height)) continue;
                if (isVanished(platform.x, platform.y)) continue;
                if (isFallen(platform.x, platform.y)) continue;
                drawPixelRect(platform.x, platform.y, platform.width, platform.height, platform.color);
                if (isVanishingPlatform(platform.x, platform.y)) {
                    const vp = getVanishingPlatform(platform.x, platform.y);
                    const elapsed = performance.now() - vp.touchedAt;
                    if (vp.touchedAt !== -1 && elapsed < 300) {
                        ctx.fillStyle = 'rgba(255, 50, 50, ' + (0.3 + 0.6 * (elapsed / 300)) + ')';
                        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    }
                }
                if (isFallingPlatform(platform.x, platform.y)) {
                    const fp = isFallingPlatform(platform.x, platform.y);
                    if (fp.touchedAt !== -1 && !fp.fallen) {
                        const elapsed = performance.now() - fp.touchedAt;
                        ctx.fillStyle = 'rgba(255, 180, 40, ' + (0.3 + 0.6 * (elapsed / 260)) + ')';
                        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    }
                }
            }
            
            drawHoles();
            drawElevator();
            drawPortals();
            for (const mp of movingPlatforms) {
                ctx.fillStyle = '#00b3a0';
                ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(mp.x + 1, mp.y + 1, mp.w - 2, mp.h - 2);
            }
            
            // 绘制尖刺
            for (const sp of spikes) {
                ctx.fillStyle = '#ff3355';
                for (let sx = 0; sx < sp.w; sx += 8) {
                    ctx.beginPath();
                    ctx.moveTo(sp.x + sx, sp.y + sp.h);
                    ctx.lineTo(sp.x + sx + 4, sp.y);
                    ctx.lineTo(sp.x + sx + 8, sp.y + sp.h);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(sp.x, sp.y, sp.w, sp.h);
            }
            
            // 绘制弹簧
            for (const sp of springs) {
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(sp.x, sp.y + 6, sp.w, sp.h - 6);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(sp.x, sp.y + 6, sp.w, sp.h - 6);
                ctx.beginPath();
                ctx.moveTo(sp.x, sp.y + sp.h);
                ctx.lineTo(sp.x + 6, sp.y + 4);
                ctx.lineTo(sp.x + 14, sp.y + sp.h);
                ctx.lineTo(sp.x + 22, sp.y + 4);
                ctx.lineTo(sp.x + sp.w, sp.y + sp.h);
                ctx.stroke();
            }
            
            // 绘制传送带
            for (const cv of conveyors) {
                ctx.fillStyle = '#334466';
                ctx.fillRect(cv.x, cv.y, cv.w, cv.h);
                ctx.strokeStyle = '#00b3a0';
                ctx.lineWidth = 2;
                ctx.strokeRect(cv.x + 1, cv.y + 1, cv.w - 2, cv.h - 2);
                const arrow = (performance.now() / 200) % 1;
                ctx.fillStyle = '#00ffcc';
                for (let ax = 0; ax < cv.w; ax += 24) {
                    const off = ((ax / 24 + arrow) % 3) * 8;
                    const y = cv.y + cv.h / 2;
                    if (cv.dir > 0) {
                        ctx.fillRect(cv.x + ax + off, y - 1, 6, 2);
                    } else {
                        ctx.fillRect(cv.x + ax + (24 - off), y - 1, 6, 2);
                    }
                }
            }
            
            if ((mode === 'dual' || mode === 'online') && !gameComplete) {
                ctx.font = '22px Courier New';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#e94560';
                ctx.fillText('红 ' + score1, canvas.width / 2 - 120, 34);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('黄 ' + score2, canvas.width / 2 + 120, 34);
                ctx.fillStyle = '#fff';
                ctx.fillText(':', canvas.width / 2, 34);
                ctx.textAlign = 'left';
            }
            
            const elapsed = (performance.now() - levelStartTime) / 1000;
            document.getElementById('timeDisplay').textContent = '当前 ' + elapsed.toFixed(1) + 's';
            let timesText = '';
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                if (levelTimes[i] !== undefined) {
                    timesText += '第' + i + '关 ' + levelTimes[i].toFixed(1) + 's  ';
                }
            }
            document.getElementById('levelTimeDisplay').textContent = timesText;
            
            if (gameComplete) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffd700';
                ctx.font = '44px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('全部通关!', canvas.width / 2, canvas.height / 2 - 80);
                
                if (mode === 'dual' || mode === 'online') {
                    let winnerText;
                    let winnerColor;
                    if (score1 > score2) {
                        winnerText = 'P1 (红) 获胜!';
                        winnerColor = '#e94560';
                    } else if (score2 > score1) {
                        winnerText = 'P2 (黄) 获胜!';
                        winnerColor = '#ffcc00';
                    } else {
                        winnerText = '平局!';
                        winnerColor = '#ffffff';
                    }
                    ctx.fillStyle = winnerColor;
                    ctx.font = '34px Courier New';
                    ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 20);
                }
                
                const total = Object.values(levelTimes).reduce((a, b) => a + b, 0);
                ctx.font = '22px Courier New';
                ctx.fillStyle = '#fff';
                const perCol = Math.ceil(TOTAL_LEVELS / 2);
                for (let i = 1; i <= TOTAL_LEVELS; i++) {
                    const t = levelTimes[i];
                    if (t !== undefined) {
                        const col = Math.floor((i - 1) / perCol);
                        const row = (i - 1) % perCol;
                        const lx = canvas.width / 2 + (col === 0 ? -110 : 110);
                        const ly = canvas.height / 2 + 10 + row * 28;
                        ctx.fillText('第' + i + '关: ' + t.toFixed(1) + 's', lx, ly);
                    }
                }
                ctx.fillStyle = '#ffd700';
                ctx.font = '28px Courier New';
                ctx.textAlign = 'right';
                ctx.fillText('通关总用时: ' + total.toFixed(1) + 's', canvas.width - 20, 40);
                if (mode === 'single') {
                    const bestTotal = Object.keys(saveData.bestTimes).reduce((a, k) => a + saveData.bestTimes[k], 0);
                    if (bestTotal > 0) {
                        ctx.fillStyle = '#00ffcc';
                        ctx.font = '20px Courier New';
                        ctx.fillText('历史最快总用时: ' + bestTotal.toFixed(1) + 's', canvas.width - 20, 70);
                    }
                }
                ctx.font = '18px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText('按 R 重新开始', 20, canvas.height - 15);
                ctx.textAlign = 'left';
            } else if (dead) {
                document.getElementById('deathScreen').style.display = 'flex';
            } else {
                document.getElementById('deathScreen').style.display = 'none';
                for (const p of activePlayers()) drawPlayer(p);
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function setKey(code, isDown) {
            switch (code) {
                case 'KeyW': keys1.w = isDown; break;
                case 'KeyA': keys1.a = isDown; break;
                case 'KeyS': keys1.s = isDown; break;
                case 'KeyD': keys1.d = isDown; break;
                case 'ArrowUp': keys2.w = isDown; break;
                case 'ArrowLeft': keys2.a = isDown; break;
                case 'ArrowDown': keys2.s = isDown; break;
                case 'ArrowRight': keys2.d = isDown; break;
            }
        }
        
        document.addEventListener('keydown', (e) => {
            const code = e.code || '';
            const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'textarea') return;
            setKey(code, true);
            if (code === 'KeyR') {
                if (mode === 'menu') return;
                if (gameComplete) {
                    gameComplete = false;
                    for (let i = 1; i <= TOTAL_LEVELS; i++) {
                        delete levelTimes[i];
                    }
                    score1 = 0;
                    score2 = 0;
                    loadLevel(1);
                } else {
                    loadLevel(currentLevel);
                }
            }
            e.preventDefault();
        });
        
        document.addEventListener('keyup', (e) => {
            const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'textarea') return;
            setKey(e.code || '', false);
        });
        
        document.getElementById('respawnBtn').addEventListener('click', () => {
            loadLevel(currentLevel);
        });
        
        const PASSCODE = '521026';
        let passInput = '';
        
        function buildPasspad() {
            const pad = document.getElementById('passpad');
            pad.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'pass-key';
                btn.textContent = i;
                btn.addEventListener('click', () => handlePassKey(String(i)));
                pad.appendChild(btn);
            }
            const cbtn = document.createElement('button');
            cbtn.className = 'pass-key';
            cbtn.textContent = 'C';
            cbtn.addEventListener('click', () => { passInput = ''; updatePassDisplay(); });
            pad.appendChild(cbtn);
            const zbtn = document.createElement('button');
            zbtn.className = 'pass-key';
            zbtn.textContent = '0';
            zbtn.addEventListener('click', () => handlePassKey('0'));
            pad.appendChild(zbtn);
            const ebtn = document.createElement('button');
            ebtn.className = 'pass-key';
            ebtn.textContent = 'OK';
            ebtn.addEventListener('click', () => tryPass());
            pad.appendChild(ebtn);
        }
        
        function updatePassDisplay() {
            document.getElementById('passDisplay').textContent = passInput + '\u00A0'.repeat(Math.max(0, 6 - passInput.length));
        }
        
        function handlePassKey(d) {
            if (passInput.length < 6) {
                passInput += d;
                updatePassDisplay();
            }
        }
        
        function tryPass() {
            if (passInput === PASSCODE) {
                document.getElementById('passLock').style.display = 'none';
                openOperatorPanel();
            } else {
                document.getElementById('passError').textContent = '密码错误';
                passInput = '';
                updatePassDisplay();
                setTimeout(() => { document.getElementById('passError').textContent = ''; }, 1200);
            }
        }
        
        function openOperatorPanel() {
            const grid = document.getElementById('opGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const cell = document.createElement('button');
                cell.className = 'op-cell';
                cell.textContent = i;
                cell.addEventListener('click', () => jumpToLevel(i));
                grid.appendChild(cell);
            }
            document.getElementById('operatorPanel').style.display = 'flex';
        }
        
        function jumpToLevel(n) {
            for (let i = 1; i < n; i++) {
                levelTimes[i] = 0;
            }
            delete levelTimes[n];
            document.getElementById('operatorPanel').style.display = 'none';
            loadLevel(n);
        }
        
        document.getElementById('operatorBtn').addEventListener('click', () => {
            passInput = '';
            updatePassDisplay();
            document.getElementById('passError').textContent = '';
            document.getElementById('passLock').style.display = 'flex';
        });
        
        document.getElementById('passClose').addEventListener('click', () => {
            document.getElementById('passLock').style.display = 'none';
        });
        
        document.getElementById('opClose').addEventListener('click', () => {
            document.getElementById('operatorPanel').style.display = 'none';
        });
        
        buildPasspad();
        
        function startGame(m) {
            mode = m;
            score1 = 0;
            score2 = 0;
            gameComplete = false;
            dead = false;
            applySkins();
            updateTouchVisibility();
            document.getElementById('menuScreen').style.display = 'none';
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                delete levelTimes[i];
            }
            loadLevel(1);
        }
        
        document.getElementById('singleBtn').addEventListener('click', () => startGame('single'));
        document.getElementById('dualBtn').addEventListener('click', () => startGame('dual'));
        
        function peerMsg(msg) {
            if (!msg || !msg.type) return;
            if (msg.type === 'input') {
                remoteKeys = msg.keys || { w: false, a: false, d: false, s: false };
            } else if (msg.type === 'countdown') {
                startCountdown();
            } else if (msg.type === 'opName') {
                document.getElementById('onlineStatus').textContent = '对手: ' + msg.name + ' | 你是 ' + (onlineRole === 'p1' ? 'P1(红, WASD)' : 'P2(黄, 方向键)');
            } else if (msg.type === 'start') {
                onlineStarted = true;
                mode = 'online';
                score1 = 0;
                score2 = 0;
                document.getElementById('onlineScreen').style.display = 'none';
                loadLevel(1);
            }
        }

        function onlineInit(conn, role) {
            onlineConn = conn;
            onlineRole = role;
            onlineJoined = true;
            document.getElementById('onlineStatus').textContent = '已连接! 你是 P' + (role === 'p1' ? '1(红)·WASD' : '2(黄)·方向键');
            conn.send(JSON.stringify({ type: 'opName', name: myName }));
            if (role === 'p1') {
                conn.send(JSON.stringify({ type: 'countdown' }));
                startCountdown();
            }
        }

        function createOnline() {
            if (onlineConn) return;
            myName = document.getElementById('nameInput').value.trim();
            if (!myName) {
                document.getElementById('onlineStatus').textContent = '请输入名字';
                return;
            }
            document.getElementById('onlineStatus').textContent = '正在创建房间...';
            const tryCreate = () => {
                const code = String(Math.floor(10000 + Math.random() * 90000));
                onlinePeer = new Peer(code);
                onlinePeer.on('open', (id) => {
                    roomCode = id;
                    document.getElementById('roomCodeInput').style.display = 'block';
                    document.getElementById('roomCodeInput').value = roomCode;
                    document.getElementById('roomCodeInput').select();
                    document.getElementById('onlineStatus').textContent = '房间码(已选中，Ctrl+C复制): ' + roomCode + ' | 等待对方加入...';
                });
                onlinePeer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        try { onlinePeer.destroy(); } catch (e) {}
                        onlinePeer = null;
                        tryCreate();
                    } else {
                        document.getElementById('onlineStatus').textContent = '创建失败: ' + (err.type || '未知错误') + '，请重试';
                    }
                });
                onlinePeer.on('connection', (conn) => {
                    conn.on('open', () => {
                        conn.on('data', (raw) => {
                            let m;
                            try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
                            peerMsg(m);
                        });
                        conn.on('close', () => {
                            document.getElementById('onlineStatus').textContent = '对手已断开';
                        });
                        onlineInit(conn, 'p1');
                    });
                });
            };
            tryCreate();
        }

        function joinOnline() {
            if (onlineConn) return;
            myName = document.getElementById('nameInput').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!myName) {
                document.getElementById('onlineStatus').textContent = '请输入名字';
                return;
            }
            if (!/^\d{5}$/.test(code)) {
                document.getElementById('onlineStatus').textContent = '请输入5位数字房间码';
                return;
            }
            document.getElementById('roomCodeInput').style.display = 'block';
            document.getElementById('onlineStatus').textContent = '正在连接房间，请稍候...';
            onlinePeer = new Peer();
            onlinePeer.on('open', () => {
                const conn = onlinePeer.connect(code, { reliable: true });
                conn.on('open', () => {
                    conn.on('data', (raw) => {
                        let m;
                        try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
                        peerMsg(m);
                    });
                    conn.on('close', () => {
                        document.getElementById('onlineStatus').textContent = '连接已断开';
                    });
                    onlineInit(conn, 'p2');
                });
                conn.on('error', () => {
                    document.getElementById('onlineStatus').textContent = '加入失败: 房间码无效，请检查';
                });
            });
            onlinePeer.on('error', (err) => {
                document.getElementById('onlineStatus').textContent = '连接失败: ' + (err.type || '未知错误');
            });
        }

        function startCountdown() {
            let n = 3;
            const el = document.getElementById('countdown');
            el.style.display = 'block';
            el.textContent = n;
            document.getElementById('onlineStatus').textContent = '比赛即将开始!';
            const timer = setInterval(() => {
                n--;
                if (n <= 0) {
                    clearInterval(timer);
                    el.style.display = 'none';
                    beginOnlineGame();
                } else {
                    el.textContent = n;
                }
            }, 1000);
        }

        function beginOnlineGame() {
            onlineStarted = true;
            mode = 'online';
            score1 = 0;
            score2 = 0;
            document.getElementById('onlineScreen').style.display = 'none';
            loadLevel(1);
        }

        document.getElementById('onlineBtn').addEventListener('click', () => {
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('onlineScreen').style.display = 'flex';
            document.getElementById('onlineStatus').textContent = '';
            document.getElementById('roomCodeInput').value = '';
        });

        document.getElementById('createRoomBtn').addEventListener('click', () => {
            createOnline();
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            document.getElementById('roomCodeInput').style.display = 'block';
            joinOnline();
        });

        document.getElementById('onlineClose').addEventListener('click', () => {
            if (onlineConn) { try { onlineConn.close(); } catch (e) {} }
            if (onlinePeer) { try { onlinePeer.destroy(); } catch (e) {} }
            onlinePeer = null;
            onlineConn = null;
            document.getElementById('onlineScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
            onlineJoined = false;
            onlineStarted = false;
            mode = 'menu';
        });
        
        // ===== 皮肤选择 =====
        function renderSkinSelect() {
            const r1 = document.getElementById('skinP1Row');
            const r2 = document.getElementById('skinP2Row');
            r1.innerHTML = '<span class="skin-label">P1（红）的皮肤</span>';
            r2.innerHTML = '<span class="skin-label">P2（黄）的皮肤</span>';
            SKINS.forEach(s => {
                const unlocked = isSkinUnlocked(s);
                const mk = (row, playerKey) => {
                    const cell = document.createElement('div');
                    cell.className = 'skin-cell' + (unlocked ? '' : ' locked') + (saveData[playerKey] === s.id ? ' selected' : '');
                    cell.style.background = s.color;
                    cell.title = s.name + (unlocked ? '' : '（通过第 ' + s.unlock + ' 关解锁）');
                    if (!unlocked) {
                        const lock = document.createElement('span');
                        lock.className = 'lock';
                        lock.textContent = '🔒';
                        cell.appendChild(lock);
                    }
                    if (unlocked) {
                        cell.addEventListener('click', () => {
                            saveData[playerKey] = s.id;
                            saveSave();
                            applySkins();
                            SND.select();
                            renderSkinSelect();
                        });
                    }
                    row.appendChild(cell);
                };
                mk(r1, 'skin1');
                mk(r2, 'skin2');
            });
        }
        
        // ===== 成就 =====
        function renderAchievements() {
            const list = document.getElementById('achievementList');
            list.innerHTML = '';
            const count = ACHIEVEMENTS.filter(a => saveData.achievements[a.id]).length;
            const head = document.createElement('div');
            head.className = 'ach-row';
            head.innerHTML = '<span class="ach-name" style="color:#ffd700">已解锁 ' + count + ' / ' + ACHIEVEMENTS.length + '</span>';
            list.appendChild(head);
            for (const a of ACHIEVEMENTS) {
                const done = !!saveData.achievements[a.id];
                const row = document.createElement('div');
                row.className = 'ach-row' + (done ? ' done' : '');
                row.innerHTML = '<span><div class="ach-name">' + a.name + '</div><div class="ach-desc">' + a.desc + '</div></span>' +
                    '<span class="ach-badge">' + (done ? '★' : '☆') + '</span>';
                list.appendChild(row);
            }
        }
        
        document.getElementById('skinBtn').addEventListener('click', () => {
            renderSkinSelect();
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('skinScreen').style.display = 'flex';
        });
        document.getElementById('skinClose').addEventListener('click', () => {
            document.getElementById('skinScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        });
        document.getElementById('achievementBtn').addEventListener('click', () => {
            renderAchievements();
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('achievementScreen').style.display = 'flex';
        });
        document.getElementById('achievementClose').addEventListener('click', () => {
            document.getElementById('achievementScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        });
        
        // ===== 移动端触控 =====
        function isTouch() {
            return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        }
        function bindTouch(id, setter) {
            const el = document.getElementById(id);
            if (!el) return;
            const on = (e) => { e.preventDefault(); SND.unlockAc(); setter(true); };
            const off = (e) => { e.preventDefault(); setter(false); };
            el.addEventListener('touchstart', on, { passive: false });
            el.addEventListener('touchend', off, { passive: false });
            el.addEventListener('touchcancel', off, { passive: false });
        }
        function updateTouchVisibility() {
            const tc = document.getElementById('touchControls');
            if (!isTouch()) { tc.style.display = 'none'; return; }
            tc.style.display = 'block';
            const dual = (mode === 'dual' || mode === 'online');
            ['tcP2Left', 'tcP2Right', 'tcP2Jump'].forEach(id => {
                document.getElementById(id).style.display = dual ? 'flex' : 'none';
            });
        }
        if (isTouch()) {
            bindTouch('tcP1Left', v => keys1.a = v);
            bindTouch('tcP1Right', v => keys1.d = v);
            bindTouch('tcP1Jump', v => keys1.w = v);
            bindTouch('tcP2Left', v => keys2.a = v);
            bindTouch('tcP2Right', v => keys2.d = v);
            bindTouch('tcP2Jump', v => keys2.w = v);
        }
        updateTouchVisibility();
        
        // ===== 初始化存档与皮肤 =====
        loadSave();
        applySkins();
        
        gameLoop();
    </script>
</body>
</html>
